openapi: 3.1.0
info:
  title: Cabinet API
  version: 0.1.0
  description: |
    Local-first API for Cabinet.
    This specification is the source of truth for API documentation.
servers:
  - url: http://127.0.0.1:17880
security: []
tags:
  - name: Runtime
  - name: Profiles
  - name: Collection
  - name: Search
  - name: Scanner
  - name: Matching
  - name: Discovery
  - name: Wishlist
  - name: Pricing
  - name: Dashboard
  - name: Auth
  - name: Licensing
  - name: AI
  - name: Chat
  - name: Telegram
  - name: Forwarding
    description: Forwarder package intake, reconciliation, and audit APIs.
  - name: Logs
  - name: Data
  - name: Backup
  - name: Onboarding
paths:
  /healthz:
    get:
      tags: [Runtime]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
  /api/runtime:
    get:
      tags: [Runtime]
      summary: Runtime configuration
      responses:
        "200":
          description: Runtime details
          content:
            application/json:
              schema:
                type: object
                properties:
                  update_channel:
                    type: string
                  update_public_key_configured:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
  /api/runtime/recovery:
    get:
      tags: [Runtime]
      summary: Crash recovery state
      responses:
        "200":
          description: Recovery flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_required:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles:
    get:
      tags: [Profiles]
      summary: List profiles
      responses:
        "200":
          description: Profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Profiles]
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/active:
    get:
      tags: [Profiles]
      summary: Get active profile
      responses:
        "200":
          description: Active profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profiles]
      summary: Set active profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id:
                  type: string
      responses:
        "200":
          description: Updated active profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/{profileID}/settings:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      tags: [Profiles]
      summary: Get profile settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profiles]
      summary: Update profile settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/{profileID}/secrets:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      tags: [Profiles]
      summary: Get profile secret
      parameters:
        - in: query
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret value
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profiles]
      summary: Upsert profile secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
      responses:
        "200":
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/items:
    get:
      tags: [Collection]
      summary: List canonical items
      responses:
        "200":
          description: Item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Collection]
      summary: Create canonical item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
  /api/items/bulk-edit:
    post:
      tags: [Collection]
      summary: Bulk edit canonical items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids, changes]
              properties:
                item_ids:
                  type: array
                  items: { type: string }
                changes:
                  $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Bulk edit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEditResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/items/{itemID}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    put:
      tags: [Collection]
      summary: Update canonical item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
  /api/items/{itemID}/instances:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      tags: [Collection]
      summary: List instances for item
      responses:
        "200":
          description: Instance list
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Collection]
      summary: Create instance for item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "201":
          description: Created instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/Error"
  /api/items/{itemID}/instances/{instanceID}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
      - in: path
        name: instanceID
        required: true
        schema: { type: string }
    put:
      tags: [Collection]
      summary: Update instance for item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstancePatch"
      responses:
        "200":
          description: Updated instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/Error"
  /api/search/items:
    get:
      tags: [Search]
      summary: Search items
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: condition
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: tags
          schema: { type: string }
        - in: query
          name: scale
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/query-sets:
    get:
      tags: [Scanner]
      summary: List scanner query sets
      description: Lists active-profile query sets including provider scope, schedule controls, rate-limit settings, and hydrated latest-run metadata used by Market Watch.
      responses:
        "200":
          description: Query set list
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_sets:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScannerQuerySet"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Scanner]
      summary: Create scanner query set
      description: Creates a provider-scoped saved search. eBay Market Watch query sets use `provider_scope=["ebay"]` with optional pagination, schedule, and rate-limit controls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerQuerySetInput"
      responses:
        "201":
          description: Created query set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerQuerySet"
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/query-sets/{querySetID}:
    put:
      tags: [Scanner]
      summary: Update scanner query set
      description: Updates saved-search filters, provider scope, pagination, schedule, enabled state, and rate-limit controls for an active-profile query set.
      parameters:
        - in: path
          name: querySetID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerQuerySetInput"
      responses:
        "200":
          description: Updated query set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerQuerySet"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Scanner]
      summary: Delete scanner query set
      parameters:
        - in: path
          name: querySetID
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Query set deleted
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/run:
    post:
      tags: [Scanner]
      summary: Run scanner now
      description: Runs the saved search and maps eBay provider auth failures to actionable provider error envelopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_set_id]
              properties:
                query_set_id:
                  type: string
      responses:
        "200":
          description: Scanner run result
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: integer
                  saved:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: eBay provider credentials are missing, expired, or rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthErrorResponse"
  /api/scanner/candidates:
    get:
      tags: [Scanner]
      summary: List scanner candidates for query set
      description: Lists saved-search candidates for output inspection and handoff, including provider/query provenance used by eBay Market Watch handoff actions.
      parameters:
        - in: query
          name: query_set_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/run:
    post:
      tags: [Integrations]
      summary: Run eBay saved-search provider
      description: Runs an eBay-scoped saved search with active-profile credentials, persists normalized candidates, and returns the hydrated run snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_set_id]
              properties:
                query_set_id:
                  type: string
      responses:
        "200":
          description: eBay provider run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: eBay provider credentials are missing, expired, or rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunAuthErrorResponse"
        "403":
          description: eBay provider credentials are rejected by the upstream API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunAuthErrorResponse"
  /api/matching/run:
    post:
      tags: [Matching]
      summary: Run candidate matching
      responses:
        "200":
          description: Matching run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/matching/results:
    get:
      tags: [Matching]
      summary: List matching results
      responses:
        "200":
          description: Matching result list
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MatchResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/buyer-interest/import:
    post:
      tags: [Integrations]
      summary: Import eBay buyer-interest state into Wishlist and Discoveries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                source_account:
                  type: string
                write_back_capability:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [listing_id]
                    properties:
                      listing_id:
                        type: string
                      title:
                        type: string
                      url:
                        type: string
                      state:
                        type: string
                      source_account:
                        type: string
                      observed_at:
                        type: string
                      write_back_capability:
                        type: string
      responses:
        "200":
          description: Import result with persisted Wishlist/Discovery identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  mode:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                  summary:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/seller-operations/preview:
    post:
      tags: [Integrations]
      summary: Preview an eBay seller operation without executing remote writes
      operationId: previewEbaySellerOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbaySellerOperationRequest"
      responses:
        "200":
          description: Seller operation preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  mode: { type: string }
                  preview:
                    $ref: "#/components/schemas/EbaySellerOperationPreview"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/seller-operations/execute:
    post:
      tags: [Integrations]
      summary: Execute a safe local seller operation or report a remote-write blocker
      operationId: executeEbaySellerOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbaySellerOperationRequest"
      responses:
        "200":
          description: Seller operation execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  mode: { type: string }
                  execution:
                    $ref: "#/components/schemas/EbaySellerOperationExecution"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/discovery/not-in-collection:
    get:
      tags: [Discovery]
      summary: List not-in-collection candidates
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: price_max
          schema: { type: number }
        - in: query
          name: date_from
          schema: { type: string }
      responses:
        "200":
          description: Discovery list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscoveryItem"
        "400":
          $ref: "#/components/responses/Error"
  /api/discovery/action:
    post:
      tags: [Discovery]
      summary: Apply discovery action
      description: Applies saved-search output handoff actions for Discoveries, Wishlist, or Inventory while preserving eBay provider/query provenance in the durable discovery action audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id, type]
              properties:
                candidate_id:
                  type: string
                type:
                  type: string
                  enum: [ignore, add_to_wishlist, track_price, create_item]
                payload:
                  type: object
                  additionalProperties: true
                  properties:
                    source: { type: string, enum: [market_watch] }
                    query_set_id: { type: string }
                    query_name: { type: string }
                    source_provider: { type: string, enum: [ebay] }
                    provider_scope:
                      type: array
                      items:
                        type: string
      responses:
        "200":
          description: Action applied with durable handoff provenance audit metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryActionResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/wishlist:
    get:
      tags: [Wishlist]
      summary: List wishlist entries
      responses:
        "200":
          description: Wishlist entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WishlistEntry"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Wishlist]
      summary: Create wishlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistEntryInput"
      responses:
        "201":
          description: Created wishlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistEntry"
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Wishlist]
      summary: Update wishlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistEntry"
      responses:
        "200":
          description: Wishlist entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Wishlist]
      summary: Delete wishlist entry
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Error"
  /api/wishlist/convert-owned:
    post:
      tags: [Wishlist]
      summary: Convert wishlist entry to owned inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: Wishlist entry converted to owned inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or cross-profile wishlist entry
  /api/pricing/track:
    post:
      tags: [Pricing]
      summary: Track item for price snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id:
                  type: string
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/pricing/history:
    get:
      tags: [Pricing]
      summary: Price history
      parameters:
        - in: query
          name: item_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Price history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/PriceSnapshot"
        "400":
          $ref: "#/components/responses/Error"
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "400":
          $ref: "#/components/responses/Error"
  /api/license/import:
    post:
      tags: [Licensing]
      summary: Import signed license
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, license]
              properties:
                profile_id:
                  type: string
                license:
                  type: object
                  required: [payload_base64, signature_base64]
                  properties:
                    payload_base64:
                      type: string
                    signature_base64:
                      type: string
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/license/status:
    get:
      tags: [Licensing]
      summary: License status
      parameters:
        - in: query
          name: profile_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  tier:
                    type: string
                  features:
                    type: array
                    items: { type: string }
                  expires_at:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
  /api/ai/test:
    post:
      tags: [AI]
      summary: Test AI connectivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id:
                  type: string
      responses:
        "200":
