openapi: 3.1.0
info:
  title: Cabinet API
  version: 0.1.0
  description: |
    Local-first API for Cabinet.
    This specification is the source of truth for API documentation.
servers:
  - url: http://127.0.0.1:8080
security: []
tags:
  - name: Runtime
  - name: Profiles
  - name: Collection
  - name: Search
  - name: Scanner
  - name: Matching
  - name: Discovery
  - name: Wishlist
  - name: Pricing
  - name: Dashboard
  - name: Auth
  - name: Licensing
  - name: AI
  - name: Logs
  - name: Data
  - name: Backup
  - name: Onboarding
paths:
  /healthz:
    get:
      tags: [Runtime]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /api/runtime:
    get:
      tags: [Runtime]
      summary: Runtime configuration
      responses:
        "200":
          description: Runtime details
          content:
            application/json:
              schema:
                type: object
                properties:
                  update_channel:
                    type: string
                  update_public_key_configured:
                    type: boolean
  /api/runtime/recovery:
    get:
      tags: [Runtime]
      summary: Crash recovery state
      responses:
        "200":
          description: Recovery flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_required:
                    type: boolean
  /api/profiles:
    get:
      tags: [Profiles]
      summary: List profiles
      responses:
        "200":
          description: Profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
    post:
      tags: [Profiles]
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/active:
    get:
      tags: [Profiles]
      summary: Get active profile
      responses:
        "200":
          description: Active profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      tags: [Profiles]
      summary: Set active profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id:
                  type: string
      responses:
        "200":
          description: Updated active profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/{profileID}/settings:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      tags: [Profiles]
      summary: Get profile settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
    put:
      tags: [Profiles]
      summary: Update profile settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/{profileID}/secrets:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      tags: [Profiles]
      summary: Get profile secret
      parameters:
        - in: query
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret value
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profiles]
      summary: Upsert profile secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
      responses:
        "200":
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/items:
    get:
      tags: [Collection]
      summary: List canonical items
      responses:
        "200":
          description: Item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
    post:
      tags: [Collection]
      summary: Create canonical item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
  /api/items/{itemID}/instances:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      tags: [Collection]
      summary: List instances for item
      responses:
        "200":
          description: Instance list
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instance"
    post:
      tags: [Collection]
      summary: Create instance for item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "201":
          description: Created instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/Error"
  /api/search/items:
    get:
      tags: [Search]
      summary: Search items
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: condition
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: tags
          schema: { type: string }
        - in: query
          name: scale
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
  /api/scanner/query-sets:
    get:
      tags: [Scanner]
      summary: List scanner query sets
      responses:
        "200":
          description: Query set list
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_sets:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScannerQuerySet"
    post:
      tags: [Scanner]
      summary: Create scanner query set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerQuerySetInput"
      responses:
        "201":
          description: Created query set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerQuerySet"
  /api/scanner/run:
    post:
      tags: [Scanner]
      summary: Run scanner now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_set_id]
              properties:
                query_set_id:
                  type: string
      responses:
        "200":
          description: Scanner run result
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: integer
                  saved:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/candidates:
    get:
      tags: [Scanner]
      summary: List scanner candidates for query set
      parameters:
        - in: query
          name: query_set_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
  /api/matching/run:
    post:
      tags: [Matching]
      summary: Run candidate matching
      responses:
        "200":
          description: Matching run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/matching/results:
    get:
      tags: [Matching]
      summary: List matching results
      responses:
        "200":
          description: Matching result list
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MatchResult"
  /api/discovery/not-in-collection:
    get:
      tags: [Discovery]
      summary: List not-in-collection candidates
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: price_max
          schema: { type: number }
        - in: query
          name: date_from
          schema: { type: string }
      responses:
        "200":
          description: Discovery list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscoveryItem"
  /api/discovery/action:
    post:
      tags: [Discovery]
      summary: Apply discovery action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id, type]
              properties:
                candidate_id:
                  type: string
                type:
                  type: string
                  enum: [ignore, add_to_wishlist, track_price, create_item]
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/wishlist:
    get:
      tags: [Wishlist]
      summary: List wishlist entries
      responses:
        "200":
          description: Wishlist entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WishlistEntry"
    post:
      tags: [Wishlist]
      summary: Create wishlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistEntryInput"
      responses:
        "201":
          description: Created wishlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistEntry"
    put:
      tags: [Wishlist]
      summary: Update wishlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistEntry"
      responses:
        "200":
          description: Wishlist entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
    delete:
      tags: [Wishlist]
      summary: Delete wishlist entry
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/pricing/track:
    post:
      tags: [Pricing]
      summary: Track item for price snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id:
                  type: string
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/pricing/history:
    get:
      tags: [Pricing]
      summary: Price history
      parameters:
        - in: query
          name: item_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Price history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/PriceSnapshot"
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /api/license/import:
    post:
      tags: [Licensing]
      summary: Import signed license
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, license]
              properties:
                profile_id:
                  type: string
                license:
                  type: object
                  required: [payload_base64, signature_base64]
                  properties:
                    payload_base64:
                      type: string
                    signature_base64:
                      type: string
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/license/status:
    get:
      tags: [Licensing]
      summary: License status
      parameters:
        - in: query
          name: profile_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  tier:
                    type: string
                  features:
                    type: array
                    items: { type: string }
                  expires_at:
                    type: string
  /api/ai/test:
    post:
      tags: [AI]
      summary: Test AI connectivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id:
                  type: string
      responses:
        "200":
          description: AI test success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/ai/suggest/title:
    post:
      tags: [AI]
      summary: AI suggestion from title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, title]
              properties:
                profile_id:
                  type: string
                title:
                  type: string
      responses:
        "200":
          description: AI suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISuggestion"
  /api/logs/activity:
    get:
      tags: [Logs]
      summary: Activity logs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogEntry"
  /api/logs/export:
    get:
      tags: [Logs]
      summary: Export logs bundle
      responses:
        "200":
          description: Logs JSON bundle
          content:
            application/json:
              schema:
                type: object
  /api/onboarding/sample-data:
    post:
      tags: [Onboarding]
      summary: Seed starter sample data for first-run onboarding
      responses:
        "200":
          description: Sample seeding result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_items:
                    type: integer
                  created_instances:
                    type: integer
                  created_wishlist_entries:
                    type: integer
                  total_items:
                    type: integer
                  total_wishlist_entries:
                    type: integer
                  already_seeded_for_profile:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/run/scheduled:
    post:
      tags: [Scanner]
      summary: Run scheduled scanner cycle
      responses:
        "200":
          description: Scheduled scanner run result
          content:
            application/json:
              schema:
                type: object
  /api/scanner/failures:
    get:
      tags: [Scanner]
      summary: List scanner failures
      responses:
        "200":
          description: Failure entries
          content:
            application/json:
              schema:
                type: object
  /api/provider/health:
    get:
      tags: [Scanner]
      summary: Provider health status
      parameters:
        - in: query
          name: provider
          schema: { type: string }
      responses:
        "200":
          description: Provider health payload
          content:
            application/json:
              schema:
                type: object
  /api/settings/reset-ignore-rules:
    post:
      tags: [Discovery]
      summary: Reset discovery ignore rules
      responses:
        "200":
          description: Ignore rules reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/wishlist/hits:
    get:
      tags: [Wishlist]
      summary: List wishlist hits
      responses:
        "200":
          description: Wishlist hits
          content:
            application/json:
              schema:
                type: object
  /api/pricing/snapshot/run:
    post:
      tags: [Pricing]
      summary: Trigger pricing snapshot run
      responses:
        "200":
          description: Snapshot run result
          content:
            application/json:
              schema:
                type: object
  /api/pricing/graph:
    get:
      tags: [Pricing]
      summary: Pricing graph series
      responses:
        "200":
          description: Graph points
          content:
            application/json:
              schema:
                type: object
  /api/pricing/by-source:
    get:
      tags: [Pricing]
      summary: Pricing grouped by source
      responses:
        "200":
          description: Source grouped pricing
          content:
            application/json:
              schema:
                type: object
  /api/pricing/stats:
    get:
      tags: [Pricing]
      summary: Pricing statistics
      responses:
        "200":
          description: Pricing stats
          content:
            application/json:
              schema:
                type: object
  /api/pricing/trend:
    get:
      tags: [Pricing]
      summary: Pricing trend analysis
      responses:
        "200":
          description: Pricing trend payload
          content:
            application/json:
              schema:
                type: object
  /api/pricing/history/export:
    get:
      tags: [Pricing]
      summary: Export pricing history
      responses:
        "200":
          description: Export payload
          content:
            application/json:
              schema:
                type: object
  /api/logs/debug:
    post:
      tags: [Logs]
      summary: Toggle debug logging
      responses:
        "200":
          description: Debug mode status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/ai/toggle:
    post:
      tags: [AI]
      summary: Enable or disable AI assist
      responses:
        "200":
          description: AI toggle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/ai/suggest/photo:
    post:
      tags: [AI]
      summary: AI suggestion from photo
      responses:
        "200":
          description: AI photo suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISuggestion"
  /api/data/export/json:
    get:
      tags: [Data]
      summary: Export full data JSON snapshot
      responses:
        "200":
          description: JSON snapshot
          content:
            application/json:
              schema:
                type: object
  /api/data/export/csv/items:
    get:
      tags: [Data]
      summary: Export items CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
  /api/data/import/json/dry-run:
    post:
      tags: [Data]
      summary: Validate JSON import without applying
      responses:
        "200":
          description: Dry run result
          content:
            application/json:
              schema:
                type: object
  /api/data/import/json/apply:
    post:
      tags: [Data]
      summary: Apply JSON import
      responses:
        "200":
          description: Import apply result
          content:
            application/json:
              schema:
                type: object
  /api/data/import/csv/dry-run:
    post:
      tags: [Data]
      summary: Validate CSV import without applying
      responses:
        "200":
          description: CSV dry run result
          content:
            application/json:
              schema:
                type: object
  /api/data/import/csv/apply:
    post:
      tags: [Data]
      summary: Apply CSV import
      responses:
        "200":
          description: CSV import apply result
          content:
            application/json:
              schema:
                type: object
  /api/data/reindex:
    post:
      tags: [Data]
      summary: Reindex data/search indexes
      responses:
        "200":
          description: Reindex result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/data/repair:
    post:
      tags: [Data]
      summary: Run data repair routine
      responses:
        "200":
          description: Repair result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/backup/run:
    post:
      tags: [Backup]
      summary: Trigger backup run
      responses:
        "200":
          description: Backup run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/backup/list:
    get:
      tags: [Backup]
      summary: List backups
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: object
  /api/backup/restore:
    post:
      tags: [Backup]
      summary: Restore from backup
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/auth/webauthn/register/begin:
    post:
      tags: [Auth]
      summary: Begin WebAuthn registration
      responses:
        "200":
          description: Registration challenge/options
          content:
            application/json:
              schema:
                type: object
  /api/auth/webauthn/register/finish:
    post:
      tags: [Auth]
      summary: Finish WebAuthn registration
      responses:
        "200":
          description: Registration finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/auth/requirements:
    get:
      tags: [Auth]
      summary: Authentication requirements for profile
      responses:
        "200":
          description: Auth requirements
          content:
            application/json:
              schema:
                type: object
  /api/auth/recovery/passphrase:
    post:
      tags: [Auth]
      summary: Set recovery passphrase
      responses:
        "200":
          description: Recovery passphrase result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/auth/recovery/reset/begin:
    post:
      tags: [Auth]
      summary: Begin recovery reset
      responses:
        "200":
          description: Recovery reset session
          content:
            application/json:
              schema:
                type: object
  /api/auth/webauthn/login/begin:
    post:
      tags: [Auth]
      summary: Begin WebAuthn login
      responses:
