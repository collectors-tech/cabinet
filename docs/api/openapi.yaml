    get:
      operationId: getApiAuthZitadelCallback
      tags: [Auth]
      summary: Complete Cabinet remote account sign-in
      description: Consumes state once, exchanges the authorisation code and creates an opaque HTTP-only Cabinet application session after strict token and role validation.
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the requested Cabinet route or the stable sign-in error state.
        "405":
          $ref: "#/components/responses/Error"
