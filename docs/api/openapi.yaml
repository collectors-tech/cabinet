  /api/companion/payloads:
    get:
      tags: [Companion]
      operationId: getApiCompanionPayloads
      summary: List the profile-scoped durable capture inbox
      security:
        - CompanionProfileBearer: []
      parameters:
        - $ref: "#/components/parameters/CompanionDeviceID"
        - in: query
          name: state
          schema: { type: string, enum: [accepted, validating, queued, processing, partial, review, completed, retryable-failed, permanently-failed, cancelled] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Capture records and actionable status totals; raw payloads are not returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionCaptureInbox" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      tags: [Companion]
      operationId: postApiCompanionPayloads
      summary: Submit a bounded passive capture envelope
      security:
        - CompanionProfileBearer: []
      parameters:
        - $ref: "#/components/parameters/CompanionDeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionPayloadSubmission"
      responses:
        "202":
          description: Raw envelope durably committed and dispatched to a typed, idempotent synchronisation pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionAcceptedPayload"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Companion]
      operationId: deleteApiCompanionPayloads
      summary: Cancel a pending or retryable capture
      security:
        - CompanionProfileBearer: []
      parameters:
        - $ref: "#/components/parameters/CompanionDeviceID"
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Capture cancelled without deleting its immutable provenance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionCaptureRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/companion/media-submissions:
    post:
      tags: [Companion]
      operationId: postApiCompanionMediaSubmissions
      summary: Submit a bounded media transport envelope
      description: Validates an authenticated JPEG or PNG, verifies its digest and dimensions, then stores it in canonical media storage with capture provenance. Content-addressed replay is idempotent and no local path is returned.
      security:
        - CompanionProfileBearer: []
      parameters:
        - $ref: "#/components/parameters/CompanionDeviceID"
        - in: header
          name: X-Cabinet-Profile
          required: true
          schema: { type: string }
        - in: header
          name: X-Cabinet-Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
        - in: header
          name: X-Cabinet-Capture-ID
          required: true
          schema: { type: string, maxLength: 128 }
        - in: header
          name: X-Cabinet-Media-Field
          required: true
          schema: { type: string, maxLength: 128 }
        - in: header
          name: X-Cabinet-Media-Filename
          required: true
          schema: { type: string, maxLength: 255 }
        - in: header
          name: X-Cabinet-Media-SHA256
          required: true
          schema: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 8388608 }
          image/png:
            schema: { type: string, format: binary, maxLength: 8388608 }
      responses:
        "200":
          description: Existing content-addressed asset linked idempotently to this capture field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionMediaAsset" }
        "201":
          description: New canonical media asset and capture link committed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanionMediaAsset" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
