                  thread_id:
                    type: string
                  action:
                    type: string
                    enum: [confirm, cancel]
                  apply_result:
                    type: object
                  telegram_reply:
                    type: object
                    properties:
                      text:
                        type: string
                      review_url:
                        type: string
                      confirmation_state:
                        type: string
                        enum: [confirmed, cancelled]
                      actions:
                        type: array
                        items:
                          type: string
                      action_buttons:
                        type: array
                        items:
                          type: object
