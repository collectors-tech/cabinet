  /api/telegram/connection/test:
    post:
      operationId: postApiTelegramConnectionTest
      tags: [Telegram]
      summary: Validate a write-only Telegram bot token for outbound polling
      description: Calls Telegram getMe and getWebhookInfo. A webhook conflict is reported without deleting it; the bot token is never returned.
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: string }
                bot_token: { type: string, writeOnly: true }
      responses:
        "200":
          description: Bot identity validated and compatible with polling
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: Bot validated but an existing webhook blocks polling
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "405": { $ref: "#/components/responses/Error" }
  /api/telegram/connection/resolve-webhook:
    post:
      operationId: postApiTelegramConnectionResolveWebhook
      tags: [Telegram]
      summary: Explicitly remove a conflicting Telegram webhook
      description: Calls deleteWebhook with pending-update preservation, then revalidates the bot for outbound polling.
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: string }
      responses:
        "200":
          description: Webhook removed and bot revalidated
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
  /api/telegram/pairing-codes:
    post:
      operationId: postApiTelegramPairingCodes
      tags: [Telegram]
      summary: Create a short-lived single-use private-chat pairing code
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: string }
      responses:
        "201":
          description: Pairing code created; only a digest is persisted
          content:
            application/json:
              schema:
                type: object
                required: [profile_id, code, expires_at]
                properties:
                  profile_id: { type: string }
                  code: { type: string, pattern: "^CAB-[A-Z0-9]{4}-[A-Z0-9]{4}$" }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
  /api/telegram/connection/status:
    get:
      operationId: getApiTelegramConnectionStatus
      tags: [Telegram]
      summary: Read non-secret Telegram polling and private-pairing status
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      parameters:
        - in: query
          name: profile_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token-safe connector status; transport is outbound long polling and public_listener is false
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
  /api/telegram/connection/pause:
    post:
      operationId: postApiTelegramConnectionPause
      tags: [Telegram]
      summary: Pause or resume Telegram outbound polling
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      requestBody:
        required: true
        content:
          application/json:
