              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
  /api/chat/messages:
    get:
      operationId: getApiChatMessages
      tags: [Chat]
      summary: List messages for a thread
      description: Agent users-administration evidence is omitted unless the caller has server-derived authority for the active profile.
      parameters:
        - in: query
          name: profile_id
          required: true
          schema:
            type: string
        - in: query
          name: thread_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        attachments_json:
                          type: array
                          description: Safe, persisted attachment metadata scoped to this message's profile and thread.
                          items:
                            type: object
                            required: [id, filename, mime_type, size_bytes, provenance, source, created_at]
                            properties:
                              id:
                                type: string
                              filename:
                                type: string
                              mime_type:
                                type: string
                              size_bytes:
                                type: integer
                                format: int64
                              provenance:
                                type: string
                                enum: [explicit_user_upload, telegram_media]
                              source:
                                type: string
                                enum: [in_app_chat, telegram]
                              created_at:
                                type: string
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: postApiChatMessages
      tags: [Chat]
      summary: Submit a user chat message for server-owned Agent dispatch
      description: >-
        Public clients may submit only role=user messages. Cabinet's in-process
        planner, provider and dispatchers exclusively persist assistant/system
        messages and trusted planner, capability, app-control, handoff or
        assistant-response evidence. Users-administration dispatch also requires
        server-derived authority for the active profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, thread_id, role, content]
              properties:
                profile_id:
                  type: string
                thread_id:
                  type: string
                role:
                  type: string
                  enum: [user]
                content:
                  type: string
                context:
                  type: object
                  description: >-
                    Untrusted request context. Server-owned agent_planner,
                    agent_capabilities, app_control, assistant_handoff,
                    assistant_response, provider, execution, preview and
                    workflow evidence is rejected.
                  additionalProperties: true
                agent_context:
                  type: object
                  description: >-
                    Request context normalized to Cabinet's allowlisted Agent
                    envelope; unknown client-supplied evidence is discarded.
                  additionalProperties: true
                attachment_ids:
                  type: array
                  description: Unique attachment IDs already owned by the same profile and thread; cross-scope or duplicate bindings fail closed.
                  uniqueItems: true
                  items:
                    type: string
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
  /api/chat/attachments:
