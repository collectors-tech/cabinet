          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/telegram/external-intake-proofs:
    post:
      operationId: postApiTelegramExternalIntakeProofs
      tags: [Telegram]
      summary: Record an authorized Telegram/OpenAI external intake proof packet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile_id
                - sender_id
                - chat_id
                - source_thread_id
                - source_message_id
                - capability_id
                - preview_id
                - confirmation_state
                - proof_approved
                - provider_trace
              properties:
                profile_id:
                  type: string
                sender_id:
                  type: string
                chat_id:
                  type: string
                source_thread_id:
                  type: string
                source_message_id:
                  type: string
                capability_id:
                  type: string
                  enum: [catalog_add_from_photo, catalog_add_from_barcode, catalog_add_from_text]
                preview_id:
                  type: string
                confirmation_state:
                  type: string
                  enum: [pending, confirmed, cancelled]
                proof_approved:
                  type: boolean
