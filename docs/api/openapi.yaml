        origin: { type: string, pattern: "^(chrome|moz)-extension://" }
        protocol_version: { type: string, const: "1" }
        capabilities: { $ref: "#/components/schemas/CompanionCapabilities" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        rotated_from_id: { type: string }
    CompanionPayloadSubmission:
      type: object
      additionalProperties: false
      required: [protocol_version, profile_id, module_id, module_version, schema_version, integration_instance_id, provider_id, url, payload_type, captured_at, page_complete, passive, attempted_write, confidence_score, redaction_summary, payload_hash, data]
      properties:
        protocol_version: { type: string, const: "1" }
