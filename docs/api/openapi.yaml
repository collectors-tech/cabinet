  /api/telegram/catalog-captures:
    post:
      tags: [Telegram]
      summary: Ingest an authorized Telegram catalog capture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, sender_id, chat_id]
              properties:
                profile_id:
                  type: string
                sender_id:
                  type: string
                chat_id:
                  type: string
                message_id:
                  type: string
                text:
                  type: string
                barcode:
                  type: string
                grouping_hint:
                  type: string
                draft:
                  type: object
                  properties:
                    part_number:
                      type: string
                    title:
                      type: string
                    brand:
                      type: string
                    category:
                      type: string
                    lookup_source:
                      type: string
                    lookup_url:
                      type: string
                    lookup_confidence:
                      type: string
                media:
                  type: array
                  items:
                    type: object
                    properties:
                      file_id:
                        type: string
                      filename:
                        type: string
                      mime_type:
                        type: string
                      kind:
                        type: string
                      content_base64:
                        type: string
                source_metadata:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Capture accepted and queued for preview confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id:
                    type: string
                  thread:
                    type: object
                  message:
                    type: object
                  attachments:
                    type: array
                    items:
                      type: object
                  preview:
                    type: object
                  inbox_item:
                    type: object
                  telegram_reply:
                    type: object
                    properties:
                      text:
                        type: string
                      review_url:
                        type: string
                      confirmation_state:
                        type: string
                      actions:
                        type: array
                        items:
                          type: string
                      action_buttons:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            kind:
                              type: string
                              enum: [url, callback, reply]
                            action:
                              type: string
                            url:
                              type: string
                            callback_data:
                              type: string
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          description: Capture needs Telegram-visible follow-up before preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [telegram_capture_needs_follow_up]
                  reason:
                    type: string
                  missing_fields:
                    type: array
                    items:
                      type: string
                  telegram_reply:
                    type: object
                    properties:
                      text:
                        type: string
                      confirmation_state:
                        type: string
                      actions:
                        type: array
                        items:
                          type: string
                      action_buttons:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            kind:
                              type: string
                              enum: [url, callback, reply]
                            action:
                              type: string
