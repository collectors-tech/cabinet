openapi: 3.1.0
info:
  title: Cabinet API
  version: 0.1.0
  description: |
    Local-first API for Cabinet.
    This specification is the source of truth for API documentation.
servers:
  - url: http://127.0.0.1:17880
security: []
tags:
  - name: Runtime
  - name: Profiles
  - name: Collection
  - name: Search
  - name: Scanner
  - name: Matching
  - name: Discovery
  - name: Wishlist
  - name: Commerce
  - name: Pricing
  - name: Dashboard
  - name: Auth
  - name: Licensing
  - name: AI
  - name: Chat
  - name: Telegram
  - name: Forwarding
    description: Forwarder package intake, reconciliation, and audit APIs.
  - name: Logs
  - name: Data
  - name: Backup
  - name: Onboarding
paths:
  /healthz:
    get:
      tags: [Runtime]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
  /api/runtime:
    get:
      tags: [Runtime]
      summary: Runtime configuration
      responses:
        "200":
          description: Runtime details
          content:
            application/json:
              schema:
                type: object
                properties:
                  update_channel:
                    type: string
                  update_public_key_configured:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
  /api/runtime/recovery:
    get:
      tags: [Runtime]
      summary: Crash recovery state
      responses:
        "200":
          description: Recovery flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_required:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles:
    get:
      tags: [Profiles]
      summary: List profiles
      responses:
        "200":
          description: Profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Profiles]
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/active:
    get:
      tags: [Profiles]
      summary: Get active profile
      responses:
        "200":
          description: Active profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profiles]
      summary: Set active profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id:
                  type: string
      responses:
        "200":
          description: Updated active profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/{profileID}/settings:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      tags: [Profiles]
      summary: Get profile settings
      description: eBay setup clients use this settings surface to read provider credentials and marketplace routing for active-profile runs.
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    description: Profile settings map. eBay setup keys include `ebay_bearer_token`, `ebay_marketplace`, and `ebay_base_url`.
                    properties:
                      ebay_bearer_token:
                        type: string
                        description: eBay Browse bearer token used by provider-backed Market Watch runs.
                      ebay_marketplace:
                        type: string
                        description: Marketplace / region code such as EBAY_AU.
                      ebay_base_url:
                        type: string
                        description: Optional eBay Browse API base URL override for tests and controlled provider stubs.
                    additionalProperties:
                      type: string
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profiles]
      summary: Update profile settings
      description: eBay setup clients use this settings surface to store provider credentials and marketplace routing for active-profile runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  description: Profile settings map. eBay setup keys include `ebay_bearer_token`, `ebay_marketplace`, and `ebay_base_url`.
                  properties:
                    ebay_bearer_token:
                      type: string
                      description: eBay Browse bearer token used by provider-backed Market Watch runs.
                    ebay_marketplace:
                      type: string
                      description: Marketplace / region code such as EBAY_AU.
                    ebay_base_url:
                      type: string
                      description: Optional eBay Browse API base URL override for tests and controlled provider stubs.
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    description: Profile settings map. eBay setup keys include `ebay_bearer_token`, `ebay_marketplace`, and `ebay_base_url`.
                    properties:
                      ebay_bearer_token:
                        type: string
                        description: eBay Browse bearer token used by provider-backed Market Watch runs.
                      ebay_marketplace:
                        type: string
                        description: Marketplace / region code such as EBAY_AU.
                      ebay_base_url:
                        type: string
                        description: Optional eBay Browse API base URL override for tests and controlled provider stubs.
                    additionalProperties:
                      type: string
        "400":
          $ref: "#/components/responses/Error"
  /api/profiles/{profileID}/secrets:
    parameters:
      - $ref: "#/components/parameters/ProfileID"
    get:
      tags: [Profiles]
      summary: Get profile secret
      parameters:
        - in: query
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret value
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profiles]
      summary: Upsert profile secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
      responses:
        "200":
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/items:
    get:
      tags: [Collection]
      summary: List canonical items
      responses:
        "200":
          description: Item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Collection]
      summary: Create canonical item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
  /api/items/bulk-edit:
    post:
      tags: [Collection]
      summary: Bulk edit canonical items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids, changes]
              properties:
                item_ids:
                  type: array
                  items: { type: string }
                changes:
                  $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Bulk edit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEditResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/items/{itemID}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    put:
      tags: [Collection]
      summary: Update canonical item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
  /api/items/{itemID}/instances:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      tags: [Collection]
      summary: List instances for item
      responses:
        "200":
          description: Instance list
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Collection]
      summary: Create instance for item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "201":
          description: Created instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/Error"
  /api/items/{itemID}/instances/{instanceID}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
      - in: path
        name: instanceID
        required: true
        schema: { type: string }
    put:
      tags: [Collection]
      summary: Update instance for item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstancePatch"
      responses:
        "200":
          description: Updated instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/Error"
  /api/search/items:
    get:
      tags: [Search]
      summary: Search items
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: condition
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: tags
          schema: { type: string }
        - in: query
          name: scale
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/query-sets:
    get:
      tags: [Scanner]
      summary: List scanner query sets
      description: Lists active-profile query sets including provider scope, schedule controls, rate-limit settings, and hydrated latest-run metadata used by Market Watch.
      responses:
        "200":
          description: Query set list
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_sets:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScannerQuerySet"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Scanner]
      summary: Create scanner query set
      description: Creates a provider-scoped saved search. eBay Market Watch query sets use `provider_scope=["ebay"]` with optional pagination, schedule, and rate-limit controls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerQuerySetInput"
      responses:
        "201":
          description: Created query set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerQuerySet"
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/query-sets/{querySetID}:
    put:
      tags: [Scanner]
      summary: Update scanner query set
      description: Updates saved-search filters, provider scope, pagination, schedule, enabled state, and rate-limit controls for an active-profile query set. When `provider_scope` is omitted from an update, the existing saved provider scope is preserved so eBay-only query edits do not widen to the default multi-provider scope.
      parameters:
        - in: path
          name: querySetID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerQuerySetInput"
      responses:
        "200":
          description: Updated query set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerQuerySet"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Scanner]
      summary: Delete scanner query set
      parameters:
        - in: path
          name: querySetID
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Query set deleted
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/run:
    post:
      tags: [Scanner]
      summary: Run scanner now
      description: Runs the saved search and maps eBay provider auth and search failures to actionable provider error envelopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_set_id]
              properties:
                query_set_id:
                  type: string
      responses:
        "200":
          description: Scanner run result
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: integer
                  saved:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: eBay provider credentials are missing, expired, or rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAuthErrorResponse"
        "429":
          description: eBay provider search failed due to upstream rate limiting or another recoverable Browse failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSearchErrorResponse"
  /api/scanner/candidates:
    get:
      tags: [Scanner]
      summary: List scanner candidates for query set
      description: Lists saved-search candidates for output inspection and handoff, including provider/query provenance, lifecycle status/provider filters, decision history, and pagination metadata used by Market Watch result inbox actions.
      parameters:
        - in: query
          name: query_set_id
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [new, seen, watching, dismissed, purchased, added_to_wishlist, added_to_inventory, expired, duplicate, failed_to_refresh]
        - in: query
          name: provider
          required: false
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Candidate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
  /api/scanner/candidates/{candidate_id}:
    patch:
      tags: [Scanner]
      summary: Update scanner candidate lifecycle status
      description: Persists a profile-scoped Market Watch result inbox lifecycle decision for a saved-search candidate, records decision history, and returns the updated candidate.
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, seen, watching, dismissed, purchased, added_to_wishlist, added_to_inventory, expired, duplicate, failed_to_refresh]
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/run:
    post:
      tags: [Integrations]
      summary: Run eBay saved-search provider
      description: Runs an eBay-scoped saved search with active-profile credentials, persists normalized candidates, and returns the hydrated run snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbayProviderRunRequest"
      responses:
        "200":
          description: eBay provider run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunResponse"
        "400":
          description: eBay provider run request could not be parsed or resolved against the active profile, or the saved-search query criteria are invalid after provider safety filtering.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EbayProviderRunClientErrorResponse"
                  - $ref: "#/components/schemas/EbayProviderRunQueryErrorResponse"
        "401":
          description: eBay provider credentials are missing, expired, or rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunAuthErrorResponse"
        "403":
          description: eBay provider credentials are rejected by the upstream API; the response preserves the structured auth error envelope while using 403 to distinguish forbidden credentials from missing credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunAuthErrorResponse"
        "429":
          description: eBay Browse rejected the saved-search run for a non-auth provider condition such as rate limiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunSearchErrorResponse"
        "405":
          description: eBay provider saved-search runs only accept POST.
          headers:
            Allow:
              description: Supported method for the provider run endpoint.
              schema:
                type: string
                enum: [POST]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayProviderRunMethodErrorResponse"
  /api/matching/run:
    post:
      tags: [Matching]
      summary: Run candidate matching
      responses:
        "200":
          description: Matching run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/matching/results:
    get:
      tags: [Matching]
      summary: List matching results
      responses:
        "200":
          description: Matching result list
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MatchResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/buyer-interest/preview:
    post:
      tags: [Integrations]
      summary: Preview eBay buyer-interest state mapping without persistence
      description: Maps watched, saved, liked, and cart-like eBay buyer-interest payloads to local Wishlist or Discoveries destinations while preserving provenance and write-back safety state.
      operationId: previewEbayBuyerInterest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbayBuyerInterestRequest"
      responses:
        "200":
          description: Buyer-interest preview result with destination and write-back summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayBuyerInterestResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/buyer-interest/import:
    post:
      tags: [Integrations]
      summary: Import eBay buyer-interest state into Wishlist and Discoveries
      description: Persists eBay buyer-interest mappings into local Wishlist entries or Discoveries candidates without claiming remote eBay write-back unless capability is verified.
      operationId: importEbayBuyerInterest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbayBuyerInterestRequest"
      responses:
        "200":
          description: Import result with persisted Wishlist/Discovery identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbayBuyerInterestResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/seller-operations/preview:
    post:
      tags: [Integrations]
      summary: Preview an eBay seller operation without executing remote writes
      operationId: previewEbaySellerOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbaySellerOperationRequest"
      responses:
        "200":
          description: Seller operation preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  mode: { type: string }
                  preview:
                    $ref: "#/components/schemas/EbaySellerOperationPreview"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/seller-operations/execute:
    post:
      tags: [Integrations]
      summary: Execute a safe local seller operation or report a remote-write blocker
      operationId: executeEbaySellerOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbaySellerOperationRequest"
      responses:
        "200":
          description: Seller operation execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  mode: { type: string }
                  execution:
                    $ref: "#/components/schemas/EbaySellerOperationExecution"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/listing-lifecycle/preview:
    post:
      tags: [Integrations]
      summary: Preview an eBay seller listing lifecycle command without marketplace writes
      description: Evaluates draft, publish, revise, end, and relist commands with capability and confirmation gates before any external eBay write can be treated as allowed.
      operationId: previewEbayListingLifecycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbayListingLifecycleRequest"
      responses:
        "200":
          description: Listing lifecycle command preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, enum: [ebay] }
                  mode: { type: string, enum: [listing_lifecycle_preview] }
                  preview:
                    $ref: "#/components/schemas/EbayListingLifecyclePreview"
        "400":
          $ref: "#/components/responses/Error"
  /api/providers/ebay/listing-lifecycle/execute:
    post:
      tags: [Integrations]
      summary: Execute local eBay listing draft commands or return remote-write blockers
      description: Completes local draft-only lifecycle commands and keeps publish, revise, end, and relist operations blocked unless confirmed API capability and adapter wiring are present.
      operationId: executeEbayListingLifecycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EbayListingLifecycleRequest"
      responses:
        "200":
          description: Listing lifecycle execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, enum: [ebay] }
                  mode: { type: string, enum: [listing_lifecycle_execute] }
                  execution:
                    $ref: "#/components/schemas/EbayListingLifecycleExecution"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/discovery/not-in-collection:
    get:
      tags: [Discovery]
      summary: List not-in-collection candidates
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: price_max
          schema: { type: number }
        - in: query
          name: date_from
          schema: { type: string }
      responses:
        "200":
          description: Discovery list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
