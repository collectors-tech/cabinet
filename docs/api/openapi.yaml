                    type: object
                  message:
                    type: object
                  attachments:
                    type: array
                    items:
                      type: object
                  preview:
                    type: object
                  inbox_item:
                    type: object
                  telegram_reply:
                    type: object
                    properties:
                      text:
                        type: string
                      review_url:
                        type: string
                      confirmation_state:
                        type: string
                      actions:
                        type: array
                        items:
                          type: string
                      action_buttons:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            kind:
                              type: string
                              enum: [url, callback, reply]
                            action:
                              type: string
                            url:
                              type: string
                            callback_data:
                              type: string
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          description: Webhook capture needs Telegram-visible follow-up before preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [telegram_capture_needs_follow_up]
                  reason:
                    type: string
                  missing_fields:
                    type: array
                    items:
                      type: string
                  telegram_reply:
                    type: object
                    properties:
                      text:
                        type: string
                      confirmation_state:
                        type: string
                      actions:
                        type: array
                        items:
                          type: string
                      action_buttons:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            kind:
                              type: string
                              enum: [url, callback, reply]
                            action:
                              type: string
