components:
  parameters:
    ProfileID:
      in: path
      name: profileID
      required: true
      schema:
        type: string
    ItemID:
      in: path
      name: itemID
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string }
    ItemInput:
      type: object
      required: [brand, category, part_number, title]
      properties:
        brand: { type: string }
        category: { type: string }
        part_number: { type: string }
        title: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        scale: { type: string }
        series: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
    Item:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    InstanceInput:
      type: object
      required: [status]
      properties:
        condition: { type: string }
        status:
          type: string
          enum: [sealed, blister, loose, custom, on_track]
        quantity: { type: integer }
        storage_location: { type: string }
        acquisition_price: { type: number }
        acquisition_date: { type: string }
        notes: { type: string }
    Instance:
      allOf:
        - $ref: "#/components/schemas/InstanceInput"
        - type: object
          properties:
            id: { type: string }
            item_id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    ScannerQuerySetInput:
      type: object
      required: [name, keywords]
      properties:
        name: { type: string }
        keywords:
          type: array
          items: { type: string }
        exclusions:
          type: array
          items: { type: string }
        max_price: { type: number }
        region: { type: string }
        condition: { type: string }
        schedule_cron: { type: string }
        enabled: { type: boolean }
        rate_limit_rps: { type: integer }
        max_retry_count: { type: integer }
    ScannerQuerySet:
      allOf:
        - $ref: "#/components/schemas/ScannerQuerySetInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    Candidate:
      type: object
      properties:
        id: { type: string }
        query_set_id: { type: string }
        listing_id: { type: string }
        title: { type: string }
        price: { type: number }
        shipping: { type: number }
        url: { type: string }
        image: { type: string }
        seller: { type: string }
        first_seen: { type: string }
        last_seen: { type: string }
        status: { type: string }
        source: { type: string }
    MatchResult:
      type: object
      properties:
        candidate_id: { type: string }
        item_id: { type: string }
        state:
          type: string
          enum: [matched, suggested, not_in_collection]
        confidence: { type: number }
        needs_review: { type: boolean }
        part_number: { type: string }
        last_updated: { type: string }
    DiscoveryItem:
      type: object
      properties:
        candidate_id: { type: string }
        title: { type: string }
        price: { type: number }
        url: { type: string }
        last_seen: { type: string }
    WishlistEntryInput:
      type: object
      required: [item_id]
      properties:
        item_id: { type: string }
        target_price: { type: number }
        priority: { type: string }
        notes: { type: string }
        highlight_hit: { type: boolean }
    WishlistEntry:
      allOf:
        - $ref: "#/components/schemas/WishlistEntryInput"
        - type: object
          properties:
            id: { type: string }
            below_target_now: { type: boolean }
            created_at: { type: string }
            updated_at: { type: string }
    PriceSnapshot:
      type: object
      properties:
        snapshot_date: { type: string }
        source: { type: string }
        min_price: { type: number }
        median_price: { type: number }
        latest_price: { type: number }
    DashboardSummary:
      type: object
      properties:
        new_discoveries: { type: integer }
        wishlist_hits: { type: integer }
        price_drops: { type: integer }
        recently_added:
          type: array
          items: { type: string }
        collection:
          type: object
          properties:
            total_items: { type: integer }
            total_instances: { type: integer }
            estimated_value: { type: number }
        cards:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              value: { type: integer }
              link: { type: string }
    AISuggestion:
      type: object
      properties:
        part_number: { type: string }
        brand: { type: string }
        title: { type: string }
        confidence: { type: number }
        requires_confirmation: { type: boolean }
    LogEntry:
      type: object
      properties:
        id: { type: string }
        level: { type: string }
        action: { type: string }
        details: { type: string }
        created_at: { type: string }
