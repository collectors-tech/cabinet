components:
  parameters:
    ProfileID:
      in: path
      name: profileID
      required: true
      schema:
        type: string
    ItemID:
      in: path
      name: itemID
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ProviderAuthErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error: { type: string, enum: [failed_to_run_scanner] }
        error_code:
          type: string
          enum: [PROVIDER_AUTH_MISSING, PROVIDER_AUTH_INVALID]
        provider: { type: string, enum: [ebay] }
        message: { type: string }
        next_action: { type: string, enum: [review_provider_credentials_and_health] }
        query_set_id: { type: string }
    ProviderHealthResponse:
      type: object
      required: [provider, status, state]
      properties:
        provider: { type: string, example: ebay }
        status:
          type: string
          enum: [ok, error, unknown]
        state:
          type: string
          enum: [ready, degraded, disabled]
        message: { type: string }
        last_error:
          type: string
          nullable: true
        retry_after_seconds:
          type: integer
          nullable: true
        updated_at:
          type: string
          nullable: true
    EbayProviderRunAuthErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error: { type: string, enum: [failed_to_run_ebay_provider] }
        error_code:
          type: string
          enum: [PROVIDER_AUTH_MISSING, PROVIDER_AUTH_INVALID]
        provider: { type: string, enum: [ebay] }
        message: { type: string }
        next_action: { type: string, enum: [review_provider_credentials_and_health] }
        query_set_id: { type: string }
    EbayProviderRunResponse:
      type: object
      required: [query_set_id, provider, candidates, run]
      properties:
        query_set_id: { type: string }
        provider: { type: string, enum: [ebay] }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        run:
          type: object
          properties:
            saved: { type: integer }
            attempts: { type: integer }
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string }
    ItemInput:
      type: object
      required: [part_number, title]
      properties:
        brand: { type: string }
        category: { type: string }
        part_number: { type: string }
        title: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        scale: { type: string }
        series: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
    ItemPatch:
      type: object
      properties:
        brand: { type: string }
        category: { type: string }
        part_number: { type: string }
        title: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        scale: { type: string }
        series: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
    Item:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    BulkEditResult:
      type: object
      properties:
        updated_count: { type: integer }
    InstanceInput:
      type: object
      required: [status]
      properties:
        condition: { type: string }
        status:
          type: string
          enum: [sealed, blister, loose, custom, on_track]
        quantity: { type: integer }
        storage_location: { type: string }
        acquisition_price: { type: number }
        acquisition_date: { type: string }
        notes: { type: string }
    InstancePatch:
      type: object
      properties:
        condition: { type: string }
        status:
          type: string
          enum: [sealed, blister, loose, custom, on_track]
        quantity: { type: integer }
        storage_location: { type: string }
        acquisition_price: { type: number }
        acquisition_date: { type: string }
        notes: { type: string }
    Instance:
      allOf:
        - $ref: "#/components/schemas/InstanceInput"
        - type: object
          properties:
            id: { type: string }
            item_id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    Photo:
      type: object
      properties:
        id: { type: string }
        item_id: { type: string }
        filename: { type: string }
        original_path: { type: string }
        preview_path: { type: string }
        thumbnail_path: { type: string }
        is_primary: { type: boolean }
        display_order: { type: integer }
        created_at: { type: string }
    ScannerQuerySetInput:
      type: object
      required: [name, keywords]
      properties:
        name: { type: string }
        keywords:
          type: array
          items: { type: string }
        exclusions:
          type: array
          items: { type: string }
        provider_scope:
          type: array
          description: Provider ids to run for this saved search. eBay-only Market Watch query sets use `ebay`.
          items:
            type: string
            enum: [ebay, amazon, bonzaslotcars, frontlinehobbies, hobbytechtoys, mrtoys.com.au]
        items_per_page:
          type: integer
          description: Requested page size for provider-backed runs; runtime applies provider-safe caps in run summaries.
        max_price: { type: number }
        region: { type: string }
        condition: { type: string }
        schedule_cron: { type: string }
        enabled: { type: boolean }
        rate_limit_rps: { type: integer }
        max_retry_count: { type: integer }
    ScannerQuerySet:
      allOf:
        - $ref: "#/components/schemas/ScannerQuerySetInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
            last_run_status:
              type: string
              enum: [never, succeeded, failed]
            last_run_at: { type: string }
            last_run_message: { type: string }
            last_candidate_count: { type: integer }
    Candidate:
      type: object
      properties:
        id: { type: string }
        query_set_id: { type: string }
        listing_id: { type: string }
        title: { type: string }
        price: { type: number }
        observed_currency: { type: string, description: Normalized listing price currency captured from provider payloads such as eBay Browse. }
        shipping: { type: number }
        url: { type: string }
        image: { type: string }
        seller: { type: string }
        first_seen: { type: string }
        last_seen: { type: string }
        status: { type: string }
        source: { type: string, description: Source provider id such as ebay. }
    MatchResult:
      type: object
      properties:
        candidate_id: { type: string }
        item_id: { type: string }
        state:
          type: string
          enum: [matched, suggested, not_in_collection]
        confidence: { type: number }
        needs_review: { type: boolean }
        part_number: { type: string }
        last_updated: { type: string }
    DiscoveryItem:
      type: object
      properties:
        candidate_id: { type: string }
        title: { type: string }
        price: { type: number }
        url: { type: string }
        last_seen: { type: string }
    DiscoveryActionResponse:
      type: object
      required: [ok, action, candidate_id, audit]
      properties:
        ok: { type: boolean }
        action:
          type: string
          enum: [ignore, add_to_wishlist, track_price, create_item]
        candidate_id: { type: string }
        audit:
          type: object
          additionalProperties: true
          properties:
            source: { type: string, enum: [market_watch] }
            source_provider: { type: string, enum: [ebay] }
            query_set_id: { type: string }
            query_name: { type: string }
            provider_scope:
              type: array
              items:
                type: string
            listing_id: { type: string }
            listing_url: { type: string }
            source_result_url: { type: string }
            observed_price: { type: number }
            observed_currency: { type: string }
            seller: { type: string }
            triage_status: { type: string }
    WishlistEntryInput:
      type: object
      required: [item_id]
      properties:
        item_id: { type: string }
        target_price: { type: number }
        priority: { type: string }
        notes: { type: string }
        highlight_hit: { type: boolean }
        owned: { type: boolean }
        price_paid: { type: number }
        purchase_url: { type: string }
        purchase_date: { type: string, format: date }
        purchase_condition: { type: string }
        quantity: { type: integer }
        needed_quantity: { type: integer }
    WishlistEntry:
      allOf:
        - $ref: "#/components/schemas/WishlistEntryInput"
        - type: object
          properties:
            id: { type: string }
            below_target_now: { type: boolean }
            created_at: { type: string }
            updated_at: { type: string }
    PriceSnapshot:
      type: object
      properties:
        snapshot_date: { type: string }
        source: { type: string }
        min_price: { type: number }
        median_price: { type: number }
        latest_price: { type: number }
    DashboardSummary:
      type: object
      properties:
        new_discoveries: { type: integer }
        wishlist_hits: { type: integer }
        price_drops: { type: integer }
        recently_added:
          type: array
          items: { type: string }
        collection:
          type: object
          properties:
            total_items: { type: integer }
            total_instances: { type: integer }
            estimated_value: { type: number }
        cards:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              value: { type: integer }
              link: { type: string }
    AISuggestion:
      type: object
      properties:
        part_number: { type: string }
        brand: { type: string }
        title: { type: string }
        confidence: { type: number }
        requires_confirmation: { type: boolean }
    ForwarderPackageImport:
      type: object
      required: [profile_id, provider, source, external_package_id, status]
      properties:
        profile_id: { type: string }
        provider: { type: string }
        source:
          type: string
          enum: [api, capture, csv, email, manual]
        external_package_id: { type: string }
        shipment_id: { type: string }
        tracking_number: { type: string }
        status:
          type: string
          enum: [received, ready_to_ship, shipped, delivered, exception]
        received_at: { type: string }
        sender: { type: string }
        warehouse_location: { type: string }
        weight_grams: { type: integer }
        raw_payload:
          type: object
          additionalProperties: true
    ForwarderPackage:
      allOf:
        - $ref: "#/components/schemas/ForwarderPackageImport"
        - type: object
          properties:
            id: { type: string }
            provenance_key: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    ForwarderPackageCSVRowError:
      type: object
      properties:
        row: { type: integer }
        error: { type: string }
    ForwarderPackageLinkRequest:
      type: object
      description: Active-profile package reconciliation decision request; package and target identifiers outside the active profile are rejected without link or audit-event mutation.
      required: [package_id, item_id]
      properties:
        profile_id:
          type: string
          description: Ignored by the API when an active profile is available.
        package_id: { type: string }
        item_id: { type: string }
        lifecycle_entry_id: { type: string }
        expected_arrival_id: { type: string }
        source: { type: string }
        decision:
          type: string
          enum: [confirmed, override]
        notes: { type: string }
        override: { type: boolean }
        actor: { type: string }
        audit_trail:
          type: array
          items: { type: string }
    ForwarderPackageUnlinkRequest:
      type: object
      description: Active-profile unlink request; unlink audit events are only created for links visible in the active profile.
      properties:
        profile_id:
          type: string
          description: Ignored by the API when an active profile is available.
        package_id: { type: string }
        source: { type: string }
        notes: { type: string }
        actor: { type: string }
        audit_trail:
          type: array
          items: { type: string }
    ForwarderPackageLink:
      type: object
      properties:
        id: { type: string }
        profile_id: { type: string }
        package_id: { type: string }
        item_id: { type: string }
        lifecycle_entry_id: { type: string }
        expected_arrival_id: { type: string }
        source: { type: string }
        decision: { type: string }
        notes: { type: string }
        audit_trail:
          type: array
          items: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    ForwarderPackageLinkEvent:
      type: object
      properties:
        id: { type: string }
        profile_id: { type: string }
        package_id: { type: string }
        link_id: { type: string }
        action:
          type: string
          enum: [confirmed, override, unlinked]
        item_id: { type: string }
        lifecycle_entry_id: { type: string }
        expected_arrival_id: { type: string }
        previous_item_id: { type: string }
        previous_lifecycle_entry_id: { type: string }
        previous_expected_arrival_id: { type: string }
        source: { type: string }
        notes: { type: string }
        audit_trail:
          type: array
          items: { type: string }
        created_at: { type: string }
    ForwarderPackageMatchSignal:
      type: object
      properties:
        name: { type: string }
        matched: { type: boolean }
        score: { type: number }
        evidence: { type: string }
    ForwarderPackageMatchSuggestion:
      type: object
      description: Non-mutating active-profile package-to-purchase-arrival suggestion with confidence and audit evidence.
      properties:
        package_id: { type: string }
        item_id: { type: string }
        lifecycle_entry_id: { type: string }
        expected_arrival_id: { type: string }
        confidence_score: { type: number }
        confidence_label:
          type: string
          enum: [high, medium, low]
        explanation:
          type: array
          items: { type: string }
        signals:
          type: array
          items:
            $ref: "#/components/schemas/ForwarderPackageMatchSignal"
        audit_trail:
          type: array
          items: { type: string }
    EbaySellerOperationRequest:
      type: object
      required: [operation, action]
      properties:
        operation:
          type: string
          enum: [messages, notifications, sold_orders, fulfilment, fulfillment, offers, orders]
        action: { type: string }
        capability:
          type: string
          enum: [unverified, read_only, confirmed_api]
        reference_id: { type: string }
        confirmed: { type: boolean }
    EbaySellerOperationPreview:
      type: object
      properties:
        operation: { type: string }
        action: { type: string }
        capability: { type: string }
        reference_id: { type: string }
        read_available: { type: boolean }
        write_available: { type: boolean }
        allowed: { type: boolean }
        remote_write: { type: boolean }
        confirmation_required: { type: boolean }
        blocker: { type: string }
    EbaySellerOperationExecution:
      type: object
      properties:
        operation: { type: string }
        action: { type: string }
        capability: { type: string }
        reference_id: { type: string }
        read_available: { type: boolean }
        write_available: { type: boolean }
        allowed: { type: boolean }
        remote_write: { type: boolean }
        confirmation_required: { type: boolean }
        executed: { type: boolean }
        local_only: { type: boolean }
        status: { type: string }
        blocker: { type: string }
        result:
          $ref: "#/components/schemas/EbaySellerOperationReadResult"
    EbaySellerOperationReadResult:
      type: object
      properties:
        operation: { type: string }
        source: { type: string }
        records:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string }
              status: { type: string }
              title: { type: string }
        summary:
          type: object
          additionalProperties:
            type: integer
    LogEntry:
      type: object
      properties:
        id: { type: string }
        level: { type: string }
        action: { type: string }
        details: { type: string }
        created_at: { type: string }
