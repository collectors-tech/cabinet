      operationId: getApiAuthZitadelSession
      tags: [Auth]
      summary: Get the current Cabinet remote application session
      security:
        - CabinetOIDCSession: []
      responses:
        "200":
          description: Non-secret remote identity and application role context.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, identity_mode, user, expires_at]
                properties:
                  authenticated: { type: boolean, const: true }
                  identity_mode: { type: string, const: zitadel }
                  user:
                    type: object
                    required: [subject, roles]
                    properties:
                      subject: { type: string }
                      email: { type: string }
                      name: { type: string }
                      roles:
                        type: array
                        items: { type: string }
                  expires_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/zitadel/refresh:
