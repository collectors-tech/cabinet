  /api/wishlist/{wishlistID}/restore:
    post:
      tags: [Wishlist]
      operationId: postApiWishlistByWishlistIDRestore
      summary: Create or run wishlist wishlistID restore
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      parameters:
        - in: path
          name: wishlistID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    CabinetLocalSession:
      type: apiKey
      in: header
      name: X-Cabinet-Session
      description: Opaque unlocked local Cabinet session for profile-scoped protected operations, including Agent users administration. Authority is derived server-side from the session and active profile membership. Failures use agent_admin_authentication_required or agent_admin_profile_forbidden without exposing protected evidence.
    CabinetOIDCSession:
      type: apiKey
      in: cookie
      name: cabinet_oidc_session
      description: Opaque HTTP-only Cabinet application session. Provider tokens remain server-side.
    CompanionProfileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Random, revocable Browser Companion credential bound to one Cabinet instance, profile, extension origin, device, protocol version and capability set.
  parameters:
    CompanionDeviceID:
      in: header
      name: X-Cabinet-Companion-Device
      required: true
      description: Stable extension-installation identifier that must match the pairing body and bound session.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProfileID:
      in: path
      name: profileID
      required: true
      schema:
        type: string
    ItemID:
      in: path
      name: itemID
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 1
          maximum: 2
    ProviderAuthErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error: { type: string, enum: [failed_to_run_scanner] }
        error_code:
          type: string
          enum: [PROVIDER_AUTH_MISSING, PROVIDER_AUTH_INVALID]
        provider: { type: string, enum: [ebay] }
        message: { type: string }
        next_action: { type: string, enum: [review_provider_credentials_and_health] }
        query_set_id: { type: string }
    ProviderSearchErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error: { type: string, enum: [failed_to_run_scanner] }
        error_code: { type: string, enum: [PROVIDER_SEARCH_FAILED] }
        provider: { type: string, enum: [ebay] }
        message: { type: string, description: Structured upstream Browse failure details preserved for diagnostics. }
        next_action: { type: string, enum: [check_provider_health_and_credentials] }
        retry_after_seconds:
          type: [integer, "null"]
          description: Upstream eBay Retry-After seconds when Browse rate limiting provides retry timing.
        query_set_id: { type: string }
    ProviderRegistryResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderRegistryEntry"
      example:
        providers:
          - provider_id: ebay
            display_name: eBay
            market_watch_scope: ebay
            auth_mode: api_key
            has_token: true
            state: ready
            setup_status:
              auth_mode: api_key
              marketplace: EBAY_AU
              token_state: stored
              validation_status: ready
              health_state: ready
              next_action: run_ebay_query_sets_from_market_watch
              base_url_set: false
    OpenAIBrowserAuthResponse:
      type: object
      additionalProperties: false
      required: [provider, auth_method, state, authenticated, profile_connected, recommended, message]
      properties:
        provider:
          type: string
          enum: [openai]
        auth_method:
          type: string
          enum: [browser_auth]
        state:
          type: string
          enum: [connected, signed_out, signing_in, runtime_missing, unavailable, verification_failed, disconnected]
        authenticated:
          type: boolean
          description: Whether the supported local Codex runtime reports a valid ChatGPT login.
        profile_connected:
          type: boolean
          description: Whether that login has passed a no-action provider test and is bound to the selected profile.
        recommended:
          type: boolean
        message:
          type: string
        global_login_preserved:
          type: boolean
          description: True when profile disconnect deliberately leaves the user's global Codex login unchanged.
    ProviderRegistryEntry:
      type: object
      required: [provider_id, display_name, auth_mode, capabilities, state]
      properties:
        provider_id: { type: string, example: ebay }
        display_name: { type: string, example: eBay }
        base_domain: { type: string, example: ebay.com }
        market_watch_scope:
          type: string
          description: Provider-scope value Market Watch saves in query sets for this manifest entry.
          example: ebay
        api_family: { type: string, example: official_api }
        api_support_profile: { type: string, example: rest_v1 }
        active_mode: { type: string, example: official_api }
        integration_mode: { type: string, example: official_api }
        provider_category: { type: string, example: chat/AI }
        provider_type: { type: string, example: assistant }
        api_available: { type: boolean }
        auth_requirement: { type: string, example: api_key }
        auth_mode: { type: string, example: api_key }
        config_schema_ref:
          type: string
          description: Registry setup schema reference; disabled placeholders may point to a placeholder schema that blocks credential entry.
          example: integrations/openai/auth
        workflow_refs:
          type: array
          description: Stable workflow references supported by this provider; disabled assistant placeholders return an empty list.
          items:
            type: string
        capabilities:
          type: object
          additionalProperties:
            type: boolean
        has_token:
          type: boolean
          description: Non-secret eBay token-presence flag; bearer token values are never returned.
        setup_status:
          allOf:
            - $ref: "#/components/schemas/EbayProviderSetupStatus"
          description: Non-secret readiness summary for the eBay setup surface; provider-specific registry entries may also project non-secret readiness maps such as OpenAI assistant readiness.
        setup_schema:
          type: object
          description: Provider-specific schema-driven setup metadata. OpenAI exposes active-profile settings fields plus write-only secret fields without returning stored credential values.
          properties:
            schema_ref: { type: string, example: integrations/openai/auth }
            persistence_scope: { type: string, example: active_profile }
            submit_target: { type: string, example: /api/profiles/:profileId/settings }
            secret_target: { type: string, example: /api/profiles/:profileId/secrets }
            fields:
              type: array
              items:
                type: object
                required: [key, label, type, persistence]
                properties:
                  key: { type: string, example: openai_api_key }
                  label: { type: string, example: API key }
                  type: { type: string, enum: [select, secret, proof_state, text, boolean] }
                  required: { type: boolean }
                  write_only: { type: boolean }
                  read_only: { type: boolean }
                  persistence: { type: string, enum: [profile_settings, profile_secrets] }
                  secret_key: { type: string, example: openai_api_key }
                  default: { type: string, example: gpt-4o-mini }
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
        actions:
          type: array
          description: Provider workflow/action metadata from the workflow/action registry including safety, schema, scheduling, Inbox event, health-impact, availability, and required next-action routing.
          items:
            type: object
            required: [action_id, label, workflow_ref, capability_category, execution_mode, classification, side_effect_level, confirmation_required, availability_state]
            properties:
              action_id: { type: string, example: assistant.chat }
              label: { type: string, example: Assistant chat }
              description: { type: string, example: Run a provider-backed assistant chat turn with profile and thread context. }
              workflow_ref: { type: string, example: assistant.chat }
              type: { type: string, example: assistant_chat }
              input_schema: { type: string, example: assistant.chat.request.v1 }
              output_schema: { type: string, example: assistant.chat.response.v1 }
              requires_auth: { type: boolean }
              requires_secrets: { type: boolean }
              capabilities:
                type: array
                items:
                  type: string
              capability_category: { type: string, example: assistant }
              execution_mode: { type: string, example: provider_workflow }
              classification: { type: string, enum: [read_only, preview_only, write, destructive] }
              side_effect_level: { type: string, enum: [read_only, preview_only, write, destructive] }
              confirmation_required: { type: boolean }
              schedule_support: { type: string, example: manual_and_scheduled }
              inbox_events:
                type: array
                items:
                  type: string
                example: [workflow_failed, required_action]
              health_impact: { type: string, example: updates_provider_health }
              availability_state: { type: string, enum: [available, setup_needed, blocked, unavailable] }
              next_action:
                type: [string, "null"]
                example: connect_openai_api_key_or_browser_auth
        seller_operations:
          type: array
          items:
            type: object
        state: { type: string, example: ready }
        setup_instructions: { type: string }
    EbayProviderSetupStatus:
      type: object
      required: [auth_mode, marketplace, token_state, validation_status, health_state, next_action, base_url_set]
      properties:
        auth_mode: { type: string, enum: [api_key] }
        marketplace: { type: string, example: EBAY_AU }
        token_state: { type: string, enum: [stored, token_required] }
        validation_status: { type: string, enum: [ready, needs_credentials, degraded] }
        health_state: { type: string, enum: [ready, disabled, degraded] }
        next_action:
          type: string
          enum: [run_ebay_query_sets_from_market_watch, save_ebay_credentials_and_marketplace, check_provider_health_and_credentials]
        base_url_set:
          type: boolean
          description: Indicates whether an eBay Browse base URL override is configured without exposing credential material.
    ProviderHealthResponse:
      type: object
      required: [provider, status, state]
      properties:
        provider: { type: string, example: ebay }
        status:
          type: string
          enum: [ok, ready, error, degraded, unknown, auth_missing, reauthentication_required, rate_limited, provider_unavailable, partial_failure]
        state:
          type: string
          enum: [ready, degraded, disabled]
        category:
          type: string
          enum: [healthy, not_checked, needs_setup, needs_reauthentication, rate_limited, provider_unavailable, failed, partially_failed]
        label:
          type: string
          example: Rate limited
        guidance:
          type: string
          example: Wait for the provider retry window, then run the watch again.
        message: { type: string }
        last_error:
          type: [string, "null"]
        retry_after_seconds:
          type: [integer, "null"]
        next_action:
          type: [string, "null"]
          enum: [check_provider_health_and_credentials, review_provider_status, null]
        updated_at:
          type: [string, "null"]
    ProviderTestResponse:
      type: object
      required: [provider, status, code, provider_test_passed, checked_at]
      properties:
        provider:
          type: string
          enum: [openai]
        profile_id:
          type: string
        status:
          type: string
          enum: [ready, failed, needs_config]
        code:
          type: string
          enum:
            - OPENAI_PROVIDER_TEST_PASSED
            - OPENAI_PROVIDER_TEST_FAILED
            - OPENAI_PROFILE_REQUIRED
            - OPENAI_AUTH_METHOD_REQUIRED
            - OPENAI_API_KEY_MISSING
            - OPENAI_BROWSER_AUTH_PROVIDER_TEST_PROOF_REQUIRED
            - OPENAI_BROWSER_AUTH_PROVIDER_TEST_FAILED
            - OPENAI_BROWSER_AUTH_PROVIDER_TEST_PASSED
            - OPENAI_BROWSER_AUTH_PROOF_REQUIRED
        auth_method:
          type: [string, "null"]
        credential_present:
          type: boolean
        provider_test_passed:
          type: boolean
        checked_at:
          type: string
          format: date-time
        base_domain:
          type: [string, "null"]
        browser_auth_state:
          type: [string, "null"]
        provider_test_state:
          type: [string, "null"]
        provider_test_artifact_id:
          type: [string, "null"]
        message:
          type: string
        next_action:
          type: string
    EbayProviderRunAuthErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error: { type: string, enum: [failed_to_run_ebay_provider] }
        error_code:
          type: string
          enum: [PROVIDER_AUTH_MISSING, PROVIDER_AUTH_INVALID]
        provider: { type: string, enum: [ebay] }
        message: { type: string }
        next_action: { type: string, enum: [review_provider_credentials_and_health] }
        query_set_id: { type: string }
    EbayProviderRunClientErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error:
          type: string
          enum: [invalid_json, missing_query_set_id, active_profile_not_set, failed_to_get_settings, invalid_query_set_id, query_set_not_scoped_to_ebay, invalid_ebay_items_per_page, failed_to_apply_provider_items_per_page, failed_to_list_ebay_candidates]
        error_code:
          type: string
          enum: [invalid_json, missing_query_set_id, active_profile_not_set, failed_to_get_settings, invalid_query_set_id, query_set_not_scoped_to_ebay, invalid_ebay_items_per_page, failed_to_apply_provider_items_per_page, failed_to_list_ebay_candidates]
          description: Stable client-error code matching the top-level error value for provider-run diagnostics.
        query_set_id:
          type: string
          description: Trimmed active-profile scanner query set id when it was parsed or resolved before the failure; blank for missing-query diagnostics.
        provider: { type: string, enum: [ebay] }
        message:
          type: string
          description: Human-readable recovery guidance for the blocked eBay provider run.
        setting:
          type: string
          enum: [integration.ebay.items_per_page]
          description: Active-profile setup setting that blocked the provider run.
        next_action: { type: string, enum: [select_existing_ebay_query_set, select_active_profile, retry_profile_settings, choose_ebay_scoped_query_set, update_ebay_items_per_page] }
    EbayProviderRunQueryErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error: { type: string, enum: [failed_to_run_ebay_provider] }
        error_code: { type: string, enum: [PROVIDER_QUERY_INVALID] }
        provider: { type: string, enum: [ebay] }
        message: { type: string, description: Saved-search keyword criteria validation guidance after provider safety filtering. }
        next_action: { type: string, enum: [edit_ebay_query_criteria] }
        query_set_id: { type: string }
    EbayProviderRunMethodErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, allowed_method]
      properties:
        error: { type: string, enum: [method_not_allowed] }
        error_code: { type: string, enum: [method_not_allowed] }
        provider: { type: string, enum: [ebay] }
        message: { type: string, description: Human-readable recovery guidance for retrying the eBay provider run with the supported method. }
        next_action: { type: string, enum: [retry_with_post] }
        allowed_method: { type: string, enum: [POST] }
    EbayProviderRunSearchErrorResponse:
      type: object
      required: [error, error_code, provider, message, next_action, query_set_id]
      properties:
        error: { type: string, enum: [failed_to_run_ebay_provider] }
        error_code: { type: string, enum: [PROVIDER_SEARCH_FAILED] }
        provider: { type: string, enum: [ebay] }
        message: { type: string, description: Structured upstream Browse failure details preserved for diagnostics. }
        next_action: { type: string, enum: [check_provider_health_and_credentials] }
        retry_after_seconds:
          type: integer
          description: Upstream eBay Retry-After seconds when Browse rate limiting provides retry timing.
        query_set_id: { type: string }
    EbayProviderRunRequest:
      type: object
      required: [query_set_id]
      properties:
        query_set_id: { type: string, description: Active-profile scanner query set id to run through the eBay provider. }
    EbayProviderRunResponse:
      type: object
      required: [query_set_id, provider, candidates, run]
      properties:
        query_set_id: { type: string }
        provider: { type: string, enum: [ebay] }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/EbayProviderRunCandidate"
        run:
          $ref: "#/components/schemas/EbayProviderRunSnapshot"
    EbayProviderRunCandidate:
      type: object
      required: [id, query_set_id, listing_id, title, price, observed_currency, shipping, url, image, seller, first_seen, last_seen, status, source, stock_state, stock_count]
      properties:
        id: { type: string }
        query_set_id: { type: string }
        listing_id: { type: string }
        title: { type: string }
        price: { type: number }
        observed_currency: { type: string, description: Normalized listing price currency captured from eBay Browse. }
        shipping: { type: number }
        url: { type: string }
        image: { type: string }
        seller: { type: string }
        first_seen: { type: string }
        last_seen: { type: string }
        status: { type: string }
        source: { type: string, enum: [ebay] }
        stock_state: { type: string, description: "Normalized eBay stock state such as in_stock, low_stock, out_of_stock, or unknown." }
        stock_count: { type: integer }
        listing_created_at: { type: string, description: Normalized eBay Browse itemCreationDate timestamp when provided. }
        listing_updated_at: { type: string, description: Normalized eBay Browse itemEndDate timestamp when provided. }
    EbayProviderRunSnapshot:
      type: object
      required: [saved, attempts, items_per_page_requested, items_per_page_effective, observed_page_size, page_count]
      properties:
        saved: { type: integer }
        attempts: { type: integer }
        items_per_page_requested: { type: integer }
        items_per_page_effective: { type: integer }
        observed_page_size: { type: integer }
        page_count: { type: integer }
        items_per_page_warning: { type: string }
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    PurchaseOrderListResponse:
      type: object
      required: [page, page_size, total, total_pages, orders]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
        orders:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrder"
    PurchaseOrder:
      type: object
      required: [order_id, source, status, total_amount, currency, line_item_count, received_count, unreceived_count, line_items]
      properties:
        order_id: { type: string }
        source: { type: string }
        seller: { type: string }
        tracking: { type: string }
        status:
          type: string
          enum: [active, received]
        total_amount: { type: number }
        currency: { type: string }
        line_item_count: { type: integer }
        received_count: { type: integer }
        unreceived_count: { type: integer }
        created_at: { type: string }
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderLineItem"
    PurchaseOrderLineItem:
      type: object
      required: [item_id, title, quantity, amount, status, lifecycle_entry_id, expected_arrival_id]
      properties:
        item_id: { type: string }
        title: { type: string }
        quantity: { type: integer }
        amount: { type: number }
        status:
          type: string
          enum: [expected, delivered, reconciled, cancelled]
        lifecycle_entry_id: { type: string }
        expected_arrival_id: { type: string }
    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string }
    ItemInput:
      type: object
      required: [part_number, title]
      properties:
        brand: { type: string }
        category: { type: string }
        part_number: { type: string }
        title: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        scale: { type: string }
        series: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
    ItemPatch:
      type: object
      properties:
        brand: { type: string }
        category: { type: string }
        part_number: { type: string }
        title: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        scale: { type: string }
        series: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
    Item:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    BulkEditResult:
      type: object
      properties:
        updated_count: { type: integer }
    InstanceInput:
      type: object
      required: [status]
      properties:
        condition: { type: string }
        status:
          type: string
          enum: [sealed, blister, loose, custom, on_track]
        quantity: { type: integer }
        storage_location: { type: string }
        acquisition_price: { type: number }
        acquisition_date: { type: string }
        notes: { type: string }
    InstancePatch:
      type: object
      properties:
        condition: { type: string }
        status:
          type: string
          enum: [sealed, blister, loose, custom, on_track]
        quantity: { type: integer }
        storage_location: { type: string }
        acquisition_price: { type: number }
        acquisition_date: { type: string }
        notes: { type: string }
    Instance:
      allOf:
        - $ref: "#/components/schemas/InstanceInput"
        - type: object
          properties:
            id: { type: string }
            item_id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
    Photo:
      type: object
      properties:
        id: { type: string }
        item_id: { type: string }
        filename: { type: string }
        original_path: { type: string }
        preview_path: { type: string }
        thumbnail_path: { type: string }
        is_primary: { type: boolean }
        display_order: { type: integer }
        created_at: { type: string }
    ScannerQuerySetInput:
      type: object
      required: [name, keywords]
      properties:
        name: { type: string }
        keywords:
          type: array
          items: { type: string }
        exclusions:
          type: array
          items: { type: string }
        provider_scope:
          type: array
          description: Provider ids to run for this saved search. eBay-only Market Watch query sets use `ebay`.
          items:
            type: string
            enum: [ebay, amazon, bonzaslotcars, frontlinehobbies, hobbytechtoys, mrtoys.com.au]
        items_per_page:
          type: integer
          description: Requested page size for provider-backed runs; runtime applies provider-safe caps in run summaries.
        max_price: { type: number }
        region: { type: string }
        condition: { type: string }
        schedule_cron: { type: string }
        enabled: { type: boolean }
        rate_limit_rps: { type: integer }
        max_retry_count: { type: integer }
    ScannerQuerySet:
      allOf:
        - $ref: "#/components/schemas/ScannerQuerySetInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
            last_run_status:
              type: string
              enum: [never, succeeded, failed]
            last_run_at: { type: string }
            last_run_message: { type: string }
            next_run_at: { type: string }
            last_candidate_count: { type: integer }
    ScheduledScannerRunResponse:
      type: object
      required: [run_id, query_sets_executed, candidates_collected, failures]
      properties:
        run_id: { type: string }
        query_sets_executed: { type: integer }
        candidates_collected: { type: integer }
        failures: { type: integer }
    ScannerFailureRetryRequest:
      type: object
      required: [query_set_id]
      properties:
        query_set_id: { type: string }
    ScannerFailureRetryResponse:
      type: object
