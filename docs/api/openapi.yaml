      responses:
        "200":
          description: Updated non-secret connector status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
  /api/telegram/connection/disconnect:
    post:
      operationId: postApiTelegramConnectionDisconnect
      tags: [Telegram]
