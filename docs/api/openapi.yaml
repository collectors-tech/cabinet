      tags: [Auth]
      summary: Start Cabinet remote account sign-in
      description: Creates one-time state, nonce and PKCE verifier state on the server, then redirects to the environment's Cabinet-branded shared ZITADEL login.
      parameters:
        - in: query
          name: return_to
          schema: { type: string }
          description: Optional same-origin Cabinet route used after successful sign-in.
        - in: query
          name: intent
          schema:
            type: string
            enum: [register, recover]
      responses:
        "302":
          description: Redirect to the discovered OIDC authorisation endpoint.
        "405":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
