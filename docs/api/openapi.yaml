        pairing_code: { type: string, pattern: "^[0-9]{6}$" }
        device_id: { type: string }
        device_name: { type: string }
        origin: { type: string, pattern: "^(chrome|moz)-extension://" }
        protocol_version: { type: string, const: "1" }
        capabilities: { $ref: "#/components/schemas/CompanionCapabilities" }
        status: { type: string, enum: [pending, approved] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CompanionPairingApproval:
