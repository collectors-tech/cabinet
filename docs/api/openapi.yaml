  /api/telegram/agent-text:
    post:
      tags: [Telegram]
      operationId: postApiTelegramAgentText
      summary: Route paired private Telegram natural language through Cabinet Agent
      description: Internal connector handoff only. External HTTP requests are rejected even when they supply valid paired identifiers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sender_id, chat_id, chat_type, message_id, text]
              properties:
                profile_id:
                  type: string
                  description: Optional claimed profile; when present it must match the server-authorized pairing.
                sender_id:
                  type: string
                chat_id:
                  type: string
                chat_type:
                  type: string
                  enum: [private]
                message_id:
                  type: string
                text:
                  type: string
                  description: Natural user text. Raw Agent Skill ids and key-value command grammar are rejected.
                source_metadata:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Natural text was recorded in the stable Telegram Cabinet thread and safely planned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "403":
          description: Sender, chat, profile, group scope, or legacy command grammar was rejected
  /api/telegram/agent-text-callbacks:
    post:
      tags: [Telegram]
      operationId: postApiTelegramAgentTextCallbacks
      summary: Apply or cancel one server-owned Telegram Agent preview
      description: Internal connector handoff only. External HTTP requests are rejected even when they supply valid paired identifiers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sender_id, chat_id, chat_type, message_id, callback_query_id, callback_data]
              properties:
                sender_id:
                  type: string
                chat_id:
                  type: string
                chat_type:
                  type: string
                  enum: [private]
                message_id:
                  type: string
                callback_query_id:
                  type: string
                callback_data:
                  type: string
                  pattern: '^asp_[0-9a-f]{32}:(apply|cancel)$'
                  description: Opaque single-use server preview token plus the bounded decision only.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "403":
          description: Callback sender, chat, profile, or preview scope was rejected
        "409":
          description: Preview is expired, stale, unavailable, or otherwise cannot transition
