        started_at: { type: string }
        finished_at: { type: string }
        status: { type: string, enum: [never, running, succeeded, failed] }
        result_count: { type: integer }
        new_result_count: { type: integer }
        error_category: { type: string }
        error_message: { type: string }
        retry_guidance: { type: string }
        next_action: { type: string, example: check_provider_health_and_credentials }
    ScannerFailuresResponse:
      type: object
      required: [failures]
      properties:
        failures:
          type: array
          items:
            $ref: "#/components/schemas/ScannerFailure"
