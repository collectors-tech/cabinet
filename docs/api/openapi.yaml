  /api/agent/skills/apply:
    post:
      tags: [Agent]
      operationId: postApiAgentSkillsApply
      summary: Create or run agent skills apply
      description: Users/admin Agent requests, including durable preview apply and replay, derive authority from the validated Cabinet session and active profile membership. Client-provided role, permission, authority, owner, or admin_session fields never grant access. Destructive skills reject direct boolean confirmation and require a durable preview plus an unexpired single-use token from the action-specific strong-confirmation endpoint for the same unchanged target.
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/agent/skills/confirm-destructive:
    post:
      tags: [Agent]
      operationId: postApiAgentSkillsConfirmDestructive
      summary: Issue an action-specific strong confirmation for a destructive Agent preview
      description: Revalidates the authenticated profile, current server-derived administrator authority when applicable, preview expiry, destructive skill identity, and exact target fingerprint before issuing a five-minute single-use confirmation token. The token authorizes only the same profile, preview, skill, and unchanged target; it is never accepted as a substitute for a durable preview.
      security:
        - CabinetLocalSession: []
        - CabinetOIDCSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, preview_id]
              properties:
                profile_id:
                  type: string
                preview_id:
                  type: string
                  pattern: ^asp_[a-f0-9]+$
              additionalProperties: false
      responses:
        "200":
          description: Action-specific destructive impact review and single-use confirmation token
          content:
            application/json:
              schema:
                type: object
                required: [confirmation_token, expires_at, action, target, impact, recovery]
                properties:
                  confirmation_token:
                    type: string
                    description: Ephemeral single-use token held only by the active review surface.
                  expires_at:
                    type: string
                    format: date-time
                  action:
                    type: string
                    enum: [remove_user, restore_backup, destructive_action]
                  target:
                    type: object
                    additionalProperties: true
                  impact:
                    type: array
                    minItems: 1
                    items: { type: string }
                  recovery:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
