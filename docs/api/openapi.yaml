  /api/forwarding/package-links:
    get:
      tags: [Forwarding]
      operationId: listForwarderPackageLinks
      summary: List active package reconciliation links and audit events
      description: Returns only active-profile package reconciliation links and decision audit events; package_id scoping never exposes another profile's links or events.
      parameters:
        - in: query
          name: package_id
          description: Optional active-profile forwarder package id used to scope returned links and events.
          schema: { type: string }
      responses:
        "200":
          description: Active package links and durable link decision events
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/ForwarderPackageLink"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ForwarderPackageLinkEvent"
                  summary:
                    type: object
                    properties:
                      count: { type: integer }
                      events: { type: integer }
        "400":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      tags: [Forwarding]
      operationId: linkForwarderPackage
      summary: Confirm or override a package-to-purchase reconciliation link
      description: Creates or overrides an active-profile reconciliation link only when the package, item, lifecycle entry, and expected arrival all belong to the active profile; cross-profile evidence is rejected without creating links or audit events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwarderPackageLinkRequest"
      responses:
        "200":
          description: Saved active reconciliation link
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    $ref: "#/components/schemas/ForwarderPackageLink"
                  mode:
                    type: string
                    enum: [forwarder_package_reconciliation_link]
        "400":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Forwarding]
      operationId: unlinkForwarderPackage
      summary: Unlink a package from its active purchase reconciliation target
      description: Records an unlink audit event only for an active-profile package link.
      parameters:
        - in: query
          name: package_id
          description: Active-profile forwarder package id whose current link should be unlinked.
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwarderPackageUnlinkRequest"
      responses:
        "200":
          description: Durable unlink audit event
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: "#/components/schemas/ForwarderPackageLinkEvent"
                  mode:
                    type: string
                    enum: [forwarder_package_reconciliation_unlink]
        "400":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/forwarding/package-match-suggestions:
    get:
      tags: [Forwarding]
      operationId: listForwarderPackageMatchSuggestions
      summary: Suggest non-mutating package-to-purchase-arrival matches
      description: Returns non-mutating suggestions derived only from active-profile forwarder packages and purchase-arrival evidence; a package_id from another profile returns an empty scoped result with zero summary counts and creates no links or audit events.
      parameters:
        - in: query
          name: package_id
          description: Optional active-profile forwarder package id used to scope non-mutating suggestions.
          schema: { type: string }
        - in: query
          name: confidence_label
          description: Optional confidence bucket filter applied after active-profile scoping.
          schema:
            type: string
            enum: [high, medium, low]
      responses:
        "200":
          description: Ordered confidence-scored match suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [forwarder_package_match_suggestions]
                  mutable:
                    type: boolean
                    enum: [false]
                  confidence_filter:
                    type: string
                    enum: ["", high, medium, low]
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ForwarderPackageMatchSuggestion"
                  summary:
                    type: object
                    properties:
                      count: { type: integer }
                      high_confidence: { type: integer }
                      medium_confidence: { type: integer }
                      low_confidence: { type: integer }
                      scoped_packages: { type: integer }
        "400":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
