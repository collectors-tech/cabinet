<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Cabinet</title>
    <meta name="title" content="Cabinet" />
    <meta
      name="description"
      content="Cabinet local-first collector workspace for inventory, discovery, and pricing."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cabinet.local" />
    <meta property="og:title" content="Cabinet" />
    <meta
      property="og:description"
      content="Cabinet local-first collector workspace for inventory, discovery, and pricing."
    />
    <meta
      property="og:image"
      content="/images/cabinet-ui.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cabinet.local" />
    <meta property="twitter:title" content="Cabinet" />
    <meta
      property="twitter:description"
      content="Cabinet local-first collector workspace for inventory, discovery, and pricing."
    />
    <meta
      property="twitter:image"
      content="/images/cabinet-ui.png"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#020817" />
    <script>
      (function () {
        var cookieName = 'vite-ui-theme=';
        var raw = document.cookie || '';
        var value = '';
        var parts = raw.split(';');
        for (var i = 0; i < parts.length; i += 1) {
          var part = parts[i].trim();
          if (part.indexOf(cookieName) === 0) {
            value = decodeURIComponent(part.substring(cookieName.length));
            break;
          }
        }

        var resolved = 'dark';
        if (value === 'light' || value === 'dark') {
          resolved = value;
        } else if (value === 'system') {
          var prefersDark = false;
          try {
            prefersDark =
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {
            prefersDark = false;
          }
          resolved = prefersDark ? 'dark' : 'light';
        }

        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(resolved);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
