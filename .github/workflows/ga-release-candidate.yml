name: Cabinet 1.0 GA Candidate Gate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit SHA to validate as the Cabinet 1.0 GA candidate
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - name: Validate exact SHA input
        shell: pwsh
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch "^[0-9a-fA-F]{40}$") { throw "commit_sha must be a full 40-character Git commit SHA." }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Confirm exact clean source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ inputs.commit_sha }}") { throw "Exact candidate checkout mismatch." }
          if ((git status --porcelain).Length -gt 0) { throw "Candidate checkout is not clean." }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui.web/package-lock.json
      - name: Install UI dependencies and validate source
        shell: pwsh
        run: |
          npm --prefix ui.web ci
          npm install -g @fission-ai/openspec@latest
          npm run security:dependencies
          npm --prefix ui.web run build
          go test ./... -count=1 -p 1 -parallel 4 -timeout 900s
          openspec validate --all --strict --no-interactive
      - name: Build and verify exact GA packages
        shell: pwsh
        run: |
          ./scripts/package-installers.ps1 -ReleaseChannel ga -ExpectedCommit "${{ inputs.commit_sha }}" -OutputDirectory dist/cabinet
          node scripts/verify-cabinet-release-package.mjs --manifest dist/cabinet/cabinet-release-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"
          $epoch = git show -s --format=%ct HEAD
          node scripts/package-browser-companion.mjs --release-channel ga --source-commit "${{ inputs.commit_sha }}" --source-date-epoch $epoch --output dist/browser-companion
          node scripts/verify-browser-companion-package.mjs --manifest dist/browser-companion/browser-companion-release-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"
          node scripts/create-ga-candidate-bundle.mjs --cabinet-manifest dist/cabinet/cabinet-release-manifest.json --companion-manifest dist/browser-companion/browser-companion-release-manifest.json --output dist/ga-candidate-bundle-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"
      - name: Attest Cabinet package and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/cabinet/cabinet-*-windows-amd64-portable.zip
          sbom-path: dist/cabinet/cabinet-*-sbom.cdx.json
      - name: Upload exact GA candidate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ga-release-candidate-${{ inputs.commit_sha }}
          if-no-files-found: error
          path: |
            dist/ga-candidate-bundle-manifest.json
            dist/cabinet
            dist/browser-companion
