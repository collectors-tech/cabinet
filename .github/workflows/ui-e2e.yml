name: UI E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui.web/package-lock.json

      - name: Install ui.web dependencies
        run: npm ci
        working-directory: ui.web

      - name: Build ui.web bundle
        run: npm run build
        working-directory: ui.web

  cypress:
    needs: ui-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui.web/package-lock.json

      - name: Run Cypress E2E journeys
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          working-directory: ui.web
          start: npm run serve:go
          wait-on: "http://127.0.0.1:17880/healthz"
          wait-on-timeout: 120
          command: npm run e2e:journeys
          browser: electron
        env:
          CABINET_E2E_MODE: "1"
          CABINET_OPEN_BROWSER: "0"

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            ui.web/cypress/artifacts
