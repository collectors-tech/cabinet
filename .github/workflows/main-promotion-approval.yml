name: Main Promotion Approval

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  exact-release-approval:
    name: "Exact #1864 promotion approval"
    runs-on: ubuntu-latest
    steps:
      - name: Verify release owner approved the exact promotion commit
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            if (!pr) throw new Error('This check must run for a pull request')
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo || pr.head.ref !== 'develop') {
              throw new Error('main promotion must be a same-repository pull request from develop')
            }

            const sha = pr.head.sha.toLowerCase()
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('promotion head must be a full commit SHA')
            const marker = `APPROVE CABINET 0.1 PRIVATE BETA ${sha}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1864,
              per_page: 100,
            })
            const approval = comments.find((comment) =>
              comment.user?.login === 'wildone' &&
              comment.body.split(/\r?\n/).some((line) => line.trim() === marker)
            )
            if (!approval) throw new Error(`Missing exact #1864 approval marker: ${marker}`)

            await core.summary
              .addHeading('Cabinet main promotion approval')
              .addRaw(`Exact commit: ${sha}\n`)
              .addLink('Approval evidence', approval.html_url)
              .write()
