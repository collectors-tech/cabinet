name: Develop Quality Gate

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  contract:
    name: Workflow contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui.web/package-lock.json
      - name: Install ui.web dependencies
        run: npm ci
        working-directory: ui.web
      - name: Build runtime UI static bundle for contract tests
        run: npm run build
        working-directory: ui.web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify develop gate workflow contract
        run: go test ./tests -run TestDevelopQualityGateWorkflowContract -count=1

  openspec:
    name: OpenSpec strict validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest
      - name: Validate OpenSpec
        run: openspec validate --all --strict --no-interactive

  ui-build:
    name: UI production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui.web/package-lock.json
      - name: Install ui.web dependencies
        run: npm ci
        working-directory: ui.web
      - name: Build ui.web bundle
        run: npm run build
        working-directory: ui.web

  go-tests:
    name: Go runtime package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui.web/package-lock.json
      - name: Install ui.web dependencies
        run: npm ci
        working-directory: ui.web
      - name: Build runtime UI static bundle for Go tests
        run: npm run build
        working-directory: ui.web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Go runtime package tests
        run: go test ./internal/... ./cmd/...

  openapi:
    name: OpenAPI parity and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui.web/package-lock.json
      - name: Install ui.web dependencies
        run: npm ci
        working-directory: ui.web
      - name: Build runtime UI static bundle for OpenAPI tests
        run: npm run build
        working-directory: ui.web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify critical API/OpenAPI parity tests
        run: go test ./internal/app -run TestOpenAPIDocumentsOnboardingSampleDataEndpoint -count=1
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml
      - name: Build API docs
        run: npx --yes @redocly/cli@latest build-docs docs/api/openapi.yaml -o docs/api/index.html
      - name: Upload API docs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-gate-api-docs
          path: docs/api/index.html

  cypress-smoke:
    name: Cypress login/profile/runtime smoke
    runs-on: ubuntu-latest
    needs: ui-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui.web/package-lock.json
      - name: Install ui.web dependencies
        run: npm ci
        working-directory: ui.web
      - name: Build runtime UI static bundle for Cypress
        run: npm run build
        working-directory: ui.web
      - name: Run Cypress smoke gate
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: ui.web
          start: npm run serve:go
          wait-on: "http://127.0.0.1:17880/healthz"
          wait-on-timeout: 120
          command: npm run e2e:ci-smoke
          browser: electron
        env:
          CABINET_E2E_MODE: "1"
          CABINET_OPEN_BROWSER: "0"
      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-gate-cypress-artifacts
          path: |
            ui.web/cypress/artifacts
            ui.web/cypress/screenshots
            ui.web/cypress/videos
