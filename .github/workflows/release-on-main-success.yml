name: Release On Main Success

on:
  workflow_run:
    workflows:
      - Main Gate
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  record-main-gate:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Record main gate without publishing
        run: |
          echo "Main Gate: ${{ github.event.workflow_run.status }}/${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow records main status only and does not publish a release. Cabinet beta publication uses the explicit #1864 approval workflow." >> "$GITHUB_STEP_SUMMARY"
