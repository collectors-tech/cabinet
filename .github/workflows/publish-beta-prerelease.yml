name: Publish Approved Cabinet Beta Prerelease

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact accepted Cabinet candidate commit
        required: true
        type: string
      candidate_run_id:
        description: Successful Beta Release Candidate Gate run ID
        required: true
        type: string
      approval_comment_id:
        description: GitHub comment ID containing exact #1864 approval
        required: true
        type: string

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  publish-approved-prerelease:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ inputs.commit_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
    steps:
      - name: Verify exact #1864 approval and successful candidate run
        id: approval
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA.toLowerCase()
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('commit_sha must be a full commit SHA')
            const runId = Number(process.env.CANDIDATE_RUN_ID)
            const commentId = Number(process.env.APPROVAL_COMMENT_ID)
            if (!Number.isSafeInteger(runId) || !Number.isSafeInteger(commentId)) throw new Error('run and comment IDs must be integers')

            const { data: comment } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
            })
            const marker = `APPROVE CABINET 0.1 PRIVATE BETA ${sha}`
            const hasExactMarker = comment.body.split(/\r?\n/).some((line) => line.trim() === marker)
            const approvalIssueNumber = Number(comment.issue_url.match(/\/issues\/(\d+)$/)?.[1] ?? 0)
            const approvalAuthor = String(comment.user?.login ?? '').toLowerCase()
            const approvalAssociation = String(comment.author_association ?? '').toUpperCase()
            const approvalChecks = {
              issue: approvalIssueNumber === 1864,
              author: approvalAuthor === 'wildone',
              exact_marker: hasExactMarker,
              association: approvalAssociation || 'UNKNOWN',
            }
            core.info(`Approval checks: ${JSON.stringify(approvalChecks)}`)
            if (!approvalChecks.issue || !approvalChecks.author || !approvalChecks.exact_marker) {
              throw new Error(`Comment ${commentId} is not exact #1864 release-owner approval for ${sha}: ${JSON.stringify(approvalChecks)}`)
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            if (run.name !== 'Beta Release Candidate Gate' || run.event !== 'workflow_dispatch' || run.head_sha !== sha || run.conclusion !== 'success') {
              throw new Error(`Run ${runId} is not a successful exact Beta Release Candidate Gate for ${sha}`)
            }
            const { data: artifactPage } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            })
            const expectedArtifact = `beta-release-candidate-${sha}`
            const artifact = artifactPage.artifacts.find((item) => item.name === expectedArtifact && !item.expired)
            if (!artifact) throw new Error(`Run ${runId} has no live ${expectedArtifact} artifact`)
            core.setOutput('approval_url', comment.html_url)

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download exact accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: beta-release-candidate-${{ inputs.commit_sha }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify Cabinet, companion and combined manifests
        run: |
          node scripts/verify-cabinet-release-package.mjs --manifest candidate/dist/cabinet/cabinet-release-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"
          node scripts/verify-browser-companion-package.mjs --manifest candidate/dist/browser-companion/browser-companion-release-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"
          node scripts/create-beta-candidate-bundle.mjs --cabinet-manifest candidate/dist/cabinet/cabinet-release-manifest.json --companion-manifest candidate/dist/browser-companion/browser-companion-release-manifest.json --output candidate/recreated-beta-candidate-bundle-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"
          cmp candidate/recreated-beta-candidate-bundle-manifest.json candidate/dist/beta-candidate-bundle-manifest.json

      - name: Resolve immutable release identity
        id: release
        env:
          APPROVAL_URL: ${{ steps.approval.outputs.approval_url }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('release/cabinet-beta-version.json')).version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          {
            cat candidate/dist/cabinet/cabinet-*-release-notes.md
            echo
            cat candidate/dist/browser-companion/cabinet-browser-companion-*-release-notes.md
            echo
            echo "Exact candidate: ${{ inputs.commit_sha }}"
            echo "Approval: $APPROVAL_URL"
          } > candidate/prerelease-body.md

      - name: Reject reused release version
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${process.env.RELEASE_TAG}` })
              throw new Error(`Immutable release tag ${process.env.RELEASE_TAG} already exists`)
            } catch (error) {
              if (error.status !== 404) throw error
            }

      - name: Publish approved immutable prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ inputs.commit_sha }}
          name: Cabinet ${{ steps.release.outputs.tag }} private beta
          body_path: candidate/prerelease-body.md
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: |
            candidate/dist/beta-candidate-bundle-manifest.json
            candidate/dist/cabinet/cabinet-release-manifest.json
            candidate/dist/cabinet/cabinet-*-windows-amd64-portable.zip
            candidate/dist/cabinet/cabinet-*-windows-amd64-portable.zip.sha256
            candidate/dist/cabinet/cabinet-*-release-notes.md
            candidate/dist/browser-companion/browser-companion-release-manifest.json
            candidate/dist/browser-companion/cabinet-browser-companion-*.zip
            candidate/dist/browser-companion/cabinet-browser-companion-*.zip.sha256
            candidate/dist/browser-companion/cabinet-browser-companion-*-release-notes.md
