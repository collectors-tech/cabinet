name: Release Portable Packages

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact full Cabinet commit to package privately
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows-portable-package:
    runs-on: windows-latest
    steps:
      - name: Validate exact SHA input
        shell: pwsh
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch "^[0-9a-fA-F]{40}$") {
            throw "commit_sha must be a full 40-character Git commit SHA."
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Confirm exact clean checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ inputs.commit_sha }}") {
            throw "Exact package checkout mismatch."
          }
          if ((git status --porcelain).Length -gt 0) {
            throw "Portable package checkout is not clean."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui.web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ui.web dependencies
        run: npm --prefix ui.web ci

      - name: Enforce production dependency security
        run: npm run security:dependencies

      - name: Run tests before packaging
        shell: pwsh
        run: |
          npm run test:release-package
          if ($LASTEXITCODE -ne 0) { throw "Release package contracts failed." }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed." }

      - name: Build Windows portable package
        shell: pwsh
        run: ./scripts/package-installers.ps1 -ExpectedCommit "${{ inputs.commit_sha }}" -OutputDirectory "dist/cabinet" -InstallUIDeps

      - name: Verify exact Windows portable package
        run: node scripts/verify-cabinet-release-package.mjs --manifest dist/cabinet/cabinet-release-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"

      - name: Attest Windows portable package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/cabinet/cabinet-*-windows-amd64-portable.zip

      - name: Attest Windows portable package CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/cabinet/cabinet-*-windows-amd64-portable.zip
          sbom-path: dist/cabinet/cabinet-*-sbom.cdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-package-${{ inputs.commit_sha }}
          if-no-files-found: error
          path: |
            dist/cabinet/cabinet-*-windows-amd64-portable.zip
            dist/cabinet/cabinet-*-windows-amd64-portable.zip.sha256
            dist/cabinet/cabinet-*-release-notes.md
            dist/cabinet/cabinet-release-manifest.json
            dist/cabinet/cabinet-*-sbom.cdx.json
