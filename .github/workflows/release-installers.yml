name: Release Portable Packages

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact full Cabinet commit to package privately
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: windows-latest
    steps:
      - name: Validate exact SHA input
        shell: pwsh
        run: |
          if ("${{ inputs.commit_sha }}" -notmatch "^[0-9a-fA-F]{40}$") {
            throw "commit_sha must be a full 40-character Git commit SHA."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Confirm exact clean checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ inputs.commit_sha }}") {
            throw "Exact package checkout mismatch."
          }
          if ((git status --porcelain).Length -gt 0) {
            throw "Portable package checkout is not clean."
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui.web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install ui.web dependencies
        run: npm --prefix ui.web ci

      - name: Enforce production dependency security
        run: npm run security:dependencies

      - name: Run tests before packaging
        shell: pwsh
        run: |
          npm run test:release-package
          if ($LASTEXITCODE -ne 0) { throw "Release package contracts failed." }
          ./scripts/build-ui-static.ps1
          if ($LASTEXITCODE -ne 0) { throw "Static UI build failed before Go tests." }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed." }

  build-windows-portable-package:
    needs: validate-source
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Confirm exact clean checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ inputs.commit_sha }}") {
            throw "Exact package checkout mismatch."
          }
          if ((git status --porcelain).Length -gt 0) {
            throw "Portable package checkout is not clean."
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui.web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install packaging dependencies
        run: npm --prefix ui.web ci

      - name: Build Windows portable package
        shell: pwsh
        run: ./scripts/package-installers.ps1 -ExpectedCommit "${{ inputs.commit_sha }}" -OutputDirectory "dist/cabinet"

      - name: Verify exact Windows portable package
        run: node scripts/verify-cabinet-release-package.mjs --manifest dist/cabinet/cabinet-release-manifest.json --expected-source-commit "${{ inputs.commit_sha }}"

      - name: Resolve exact package evidence paths
        id: package-evidence
        shell: pwsh
        run: |
          $packageFiles = @(Get-ChildItem -LiteralPath "dist/cabinet" -Filter "cabinet-*-windows-amd64-portable.zip" -File)
          $sbomFiles = @(Get-ChildItem -LiteralPath "dist/cabinet" -Filter "cabinet-*-sbom.cdx.json" -File)
          if ($packageFiles.Count -ne 1) {
            throw "Expected exactly one Windows portable package, found $($packageFiles.Count)."
          }
          if ($sbomFiles.Count -ne 1) {
            throw "Expected exactly one CycloneDX SBOM, found $($sbomFiles.Count)."
          }
          $workspace = (Get-Location).Path
          $packagePath = [IO.Path]::GetRelativePath($workspace, $packageFiles[0].FullName).Replace('\', '/')
          $sbomPath = [IO.Path]::GetRelativePath($workspace, $sbomFiles[0].FullName).Replace('\', '/')
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "package_path=$packagePath" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sbom_path=$sbomPath" -Encoding utf8

      - name: Attest Windows portable package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-evidence.outputs.package_path }}

      - name: Attest Windows portable package CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-evidence.outputs.package_path }}
          sbom-path: ${{ steps.package-evidence.outputs.sbom_path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-package-${{ inputs.commit_sha }}
          if-no-files-found: error
          path: |
            dist/cabinet/cabinet-*-windows-amd64-portable.zip
            dist/cabinet/cabinet-*-windows-amd64-portable.zip.sha256
            dist/cabinet/cabinet-*-release-notes.md
            dist/cabinet/cabinet-release-manifest.json
            dist/cabinet/cabinet-*-sbom.cdx.json
