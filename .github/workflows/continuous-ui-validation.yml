name: continuous-ui-validation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: continuous-ui-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hourly-ui-validation:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore hourly validation revision state
        id: hourly-state
        uses: actions/cache/restore@v4
        with:
          path: .logs/hourly-ui-validation-state.json
          key: hourly-ui-validation-state-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hourly-ui-validation-state-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui.web/package-lock.json

      - name: Install UI dependencies
        shell: pwsh
        run: npm --prefix ui.web ci

      - name: Build Cabinet runtime
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/build-cabinet.ps1

      - name: Authenticate gh
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Run hourly release-aware UI validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoLogo -NoProfile -File ./scripts/hourly-ui-validation.ps1 -Browser chrome

      - name: Save hourly validation revision state
        if: always() && steps.hourly-state.outputs.cache-hit != 'true' && hashFiles('.logs/hourly-ui-validation-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .logs/hourly-ui-validation-state.json
          key: hourly-ui-validation-state-${{ runner.os }}-${{ github.sha }}

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-ui-validation-logs
          path: .logs/hourly-ui-validation/
